   <div class="hg-q"><b>Main symptom</b><div class="ww-syms">${WW_SYM.map(s => `<button type="button" class="ww-sym${WW.sym === s[0] ? ' on' : ''}" aria-pressed="${WW.sym === s[0]}" onclick="wwSet('sym','${s[0]}')"><span>${s[1]}</span>${esc(s[2])}</button>`).join('')}</div></div>
   ${qs.map(q => `<div class="hg-q"><b>${q[1]}</b>${chips(q[0], q[2], WW.a[q[0]])}</div>`).join('')}
  </section>
  <section>${!WW.sym ? '<div class="hg-empty">Pick a symptom to see likely causes.</div>' : `<h2>Most likely causes</h2>
   ${causes.map((c, i) => { const C = CAUSE[c.k]; return `<div class="hg-sec ww-cause"><div class="ww-ch"><b>${i + 1}. ${C.t}</b><span class="chip ${c.w >= top && c.w >= 4 ? 'chip-bad' : c.w >= 3 ? 'chip-warn' : 'chip-n'}">${c.w >= top && c.w >= 4 ? 'Most likely' : c.w >= 3 ? 'Likely' : 'Possible'}</span></div>
     ${c.why.length ? `<p class="hg-note">${[...new Set(c.why)].map(esc).join(' · ')}</p>` : ''}<ul class="hg-list">${C.fix.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
     ${c.k === 'pests' && pests.length ? `<div class="fchips" style="margin-top:8px">${pests.map(id => `<a class="fchip" href="#/pests/${id}">🐛 ${esc(PEST(id).name)}</a>`).join('')}<a class="fchip" href="#/pests">Pest ID</a></div>` : c.k === 'pests' ? '<p><a class="btn" href="#/pests">🐛 Open Pest ID</a></p>' : ''}
     <p class="hg-note">Source: ${C.src.map(id => `<a href="${SRC(id).url}" target="_blank" rel="noopener">${esc(SRC(id).publisher)}</a>`).join(', ')}</p></div>`; }).join('')}
   ${p ? `<div class="hg-sec"><h3>About ${esc(p.name)}</h3><ul class="hg-list">${wwPlantNotes(p).map(x => `<li>${esc(x)}</li>`).join('')}<li><b>Water:</b> ${esc(p.water.note)}</li><li><b>Light:</b> ${esc(p.light.note)}</li></ul><div class="hg-quick"><a class="btn" href="#/plant/${p.id}">🪴 Care sheet</a><a class="btn" href="#/checkup/${p.id}">🩺 Run a Checkup</a></div></div>` : '<p class="hg-note">Choose the plant above for advice that fits its needs.</p>'}`}
  </section></div>`;
  if (S.view === 'whatswrong') window.scrollTo(0, y);
}
function renderWhatsWrong(m, sym) { if (sym && WW_SYM.some(s => s[0] === sym) && WW.sym !== sym) { WW.sym = sym; WW.a = {}; } m.innerHTML = '<div class="view" id="ww-view"></div>'; wwPaint(); }

// ── Pest ID ──
let PI = { signs: [] };
function piSign(k) { const i = PI.signs.indexOf(k); if (i >= 0) PI.signs.splice(i, 1); else PI.signs.push(k); renderPests(document.getElementById('main')); }
const pestCard = x => `<a class="hg-card" href="#/pests/${x.id}" style="text-decoration:none;color:inherit">${photoBox(x, '', true)}<div class="hg-card-b"><b>${esc(x.name)}</b><i>${esc(x.sci)}</i><span class="hg-note">${esc(x.signs.split('.')[0])}.</span></div></a>`;
function renderPests(m, id) {
  if (id) return renderPest(m, id);
  const scored = HG.PEST_INFO.map(x => ({ x, n: x.sees.filter(s => PI.signs.includes(s)).length })).filter(r => !PI.signs.length || r.n).sort((a, b) => b.n - a.n);
  m.innerHTML = `<div class="view"><h1>Pest ID</h1><p class="hg-lead">Tick what you see to narrow it down, or browse all ${HG.PEST_INFO.length} common houseplant pests. Identification and control follow University of Minnesota Extension.</p>
  <section class="hg-sec"><b>What do you see?</b><div class="fchips" style="margin-top:8px">${HG.PEST_SIGNS.map(s => `<button type="button" class="fchip${PI.signs.includes(s[0]) ? ' on' : ''}" aria-pressed="${PI.signs.includes(s[0])}" onclick="piSign('${s[0]}')">${esc(s[1])}</button>`).join('')}</div>${PI.signs.length ? `<p class="hg-note" style="margin-top:8px">${scored.length} match${scored.length === 1 ? '' : 'es'} · <a href="javascript:void(0)" onclick="PI.signs=[];renderPests(document.getElementById('main'))">Clear</a></p>` : ''}</section>
  <div class="hg-cards">${scored.map(r => pestCard(r.x)).join('')}</div>
  <section class="hg-sec" style="margin-top:16px"><h2>Preventing pests</h2><ul class="hg-list">${HG.PEST_ADVICE.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="hg-note">Source: <a href="${SRC('umn-pests').url}" target="_blank" rel="noopener">University of Minnesota Extension</a></p></section></div>`;
  fillPhotos(m);
}
function renderPest(m, id) {
  const x = PEST(id); if (!x) { m.innerHTML = '<div class="view"><h1>Pest not found</h1><div class="hg-empty">That pest isn’t in the guide, or its link has changed.</div><p><a class="btn" href="#/pests">Pest ID</a></p></div>'; return; }
  const plants = HG.plants.filter(p => p.pests.some(k => (HG.PEST_ALIAS[k] || k) === x.id));
  m.innerHTML = `<div class="view"><button class="hg-back" onclick="history.length>1?history.back():nav('#/pests')">← Back</button>
  <div class="hg-plant-top">${photoBox(x)}<div><h1>${esc(x.name)}</h1><p class="hg-sci">${esc(x.sci)}</p>
   <div class="hg-facts"><div><b>What it looks like</b>${esc(x.look)}</div><div><b>Where to look</b>${esc(x.where)}</div></div></div></div>
  <div class="hg-grid2"><section class="hg-sec"><h2>Signs and damage</h2><p>${esc(x.signs)}</p><h3>How to confirm</h3><p>${esc(x.confirm)}</p></section>
  <section class="hg-sec"><h2>What to do</h2><ol class="hg-list">${x.control.map(c => `<li>${esc(c)}</li>`).join('')}</ol><p class="hg-note">Start at the top; most sprays need repeating. Read and follow the product label.</p></section></div>
  ${plants.length ? `<section class="hg-sec"><h2>Plants in the guide it affects</h2><div class="fchips">${plants.map(p => `<a class="fchip" href="#/plant/${p.id}">${esc(p.name)}</a>`).join('')}</div><p class="hg-note">From each plant’s sources; any plant can get them.</p></section>` : ''}
  ${x.id === 'fungus-gnats' || x.id === 'springtails' ? `<section class="hg-sec hg-xlinks"><h2>See them up close</h2><a href="${HG.APPS['field-guide'].url}" target="_blank" rel="noopener"><b>${HG.APPS['field-guide'].name}</b><br><span class="hg-note">${HG.APPS['field-guide'].why}</span></a></section>` : ''}
  <section class="hg-sec"><h2>Sources</h2><ol class="hg-src">${x.src.map(srcLine).join('')}</ol></section></div>`;
  fillPhotos(m); document.title = x.name + ' · Houseplant Guide';
}
</script>
<script data-file="js/mine.js">
// ═════════════════════════════════════════════════════════════════
// MY PLANTS: the owner's collection, care log, cuttings tracker and printable care cards.
// Everything stays in this browser (hg.myplants.v1); export and import move it between devices.
// ═════════════════════════════════════════════════════════════════
const MY_KEY = 'hg.myplants.v1';
const MY_EVENTS = { water: ['💧', 'Watered'], feed: ['🧪', 'Fed'], repot: ['🪴', 'Repotted'], prune: ['✂️', 'Pruned'], move: ['📦', 'Moved'], pest: ['🐛', 'Treated for pests'], note: ['📝', 'Note'] };
const CUT_STAGES = [['start', 'Started'], ['roots', 'Rooted'], ['potted', 'Potted up'], ['done', 'Established']];
let MY = (() => { try { const j = JSON.parse(localStorage.getItem(MY_KEY) || 'null'); if (j && Array.isArray(j.plants)) return Object.assign({ cuttings: [] }, j); } catch (e) { /* ignore */ } return { plants: [], cuttings: [] }; })();
const MYV = { tab: 'collection', adding: false, cutAdding: false, cards: [] };
function mySave() { try { localStorage.setItem(MY_KEY, JSON.stringify(MY)); return true; } catch (e) { toast('Could not save: storage is blocked'); return false; } }
const today = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const daysSince = iso => { if (!iso) return null; const a = new Date(iso + 'T12:00:00'), b = new Date(today() + 'T12:00:00'); return Math.round((b - a) / 864e5); };
const ago = n => n == null ? 'never' : n === 0 ? 'today' : n === 1 ? 'yesterday' : n < 0 ? 'in the future' : n + ' days ago';
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const myItem = id => MY.plants.find(x => x.id === id);
const lastOf = (it, type) => { const l = it.log.filter(e => e.type === type).sort((a, b) => b.d.localeCompare(a.d))[0]; return l ? l.d : null; };
function myDue(it) { if (!it.interval) return null; const n = daysSince(lastOf(it, 'water') || it.added); return n == null ? null : n - it.interval; }
function myCheckups(it) { const k = it.plant + '|' + (it.nick || '').toLowerCase(); return ckLoad().filter(c => c.plant + '|' + (c.nick || '').toLowerCase() === k).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)); }
function myLog(id, type, d, note) { const it = myItem(id); if (!it) return; it.log.push({ id: newId(), type, d: d || today(), note: note || '' }); mySave(); toast(MY_EVENTS[type][1] + ' · ' + (it.nick || P(it.plant).name)); mineRefresh(); }
function myAdd(plant, nick) {
  const p = P(plant); if (!p) return toast('Choose a plant');
  const it = { id: newId(), plant, nick: (nick || '').trim() || p.name, room: '', added: today(), interval: null, notes: '', log: [] };
  MY.plants.push(it); mySave(); MYV.adding = false; toast('Added to My plants'); return it;
}
function myAddFromPage(plant) { const it = myAdd(plant, ''); if (it) nav('#/mine/' + it.id); }
function myRemove(id) { if (!confirm('Remove this plant and its care log from My plants? Saved checkups stay.')) return; MY.plants = MY.plants.filter(x => x.id !== id); mySave(); nav('#/mine'); }
function myField(id, k, el) { const it = myItem(id); if (!it) return; let v = el.value; if (k === 'interval') v = v === '' ? null : Math.max(1, Math.min(120, parseInt(v, 10) || 1)); if (k === 'nick') v = v.trim() || P(it.plant).name; it[k] = v; mySave(); }
function myDelEvent(id, eid) { const it = myItem(id); it.log = it.log.filter(e => e.id !== eid); mySave(); mineRefresh(); }
function mineRefresh() { const m = document.getElementById('main'), y = window.scrollY; route(); window.scrollTo(0, y); }
function myCheckup(id) { const it = myItem(id); ckPick(it.plant); CK.nick = it.nick; nav('#/checkup/' + it.plant); }

// ── Views ──
const tabsMine = () => `<div class="hg-ltabs fchips">${[['collection', '🪴 Collection'], ['cuttings', '🌱 Cuttings'], ['cards', '🖨️ Care cards'], ['data', '💾 Backup']].map(t => `<button type="button" class="fchip${MYV.tab === t[0] ? ' on' : ''}" aria-pressed="${MYV.tab === t[0]}" onclick="MYV.tab='${t[0]}';mineRefresh()">${t[1]}</button>`).join('')}</div>`;
const plantOptions = sel => HG.plants.slice().sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${x.id}"${x.id === sel ? ' selected' : ''}>${esc(x.name)} (${esc(x.sci)})</option>`).join('');
function myStatus(it) {
  const due = myDue(it), w = lastOf(it, 'water');
  const dueChip = due == null ? '' : due >= 0 ? `<span class="chip chip-warn">🔔 Check the soil${due > 0 ? ` (${due} day${due > 1 ? 's' : ''} over)` : ' today'}</span>` : `<span class="chip chip-n">Next check in ${-due} day${due < -1 ? 's' : ''}</span>`;
  const ck = myCheckups(it).pop();
  return `<span class="chip chip-n">💧 ${w ? 'Watered ' + ago(daysSince(w)) : 'No watering logged'}</span>${dueChip}${ck ? `<span class="chip ${ck.pct >= 76 ? 'chip-ok' : ck.pct >= 60 ? 'chip-warn' : 'chip-bad'}">🩺 ${ck.pct}% ${ck.rating}</span>` : ''}`;
}
function renderCollection() {
  const list = MY.plants.slice().sort((a, b) => { const da = myDue(a), db = myDue(b); return (db == null ? -999 : db) - (da == null ? -999 : da) || a.nick.localeCompare(b.nick); });
  const due = MY.plants.filter(x => (myDue(x) || -1) >= 0).length;
  return `<section class="hg-sec"><div class="mp-bar"><div><b>${MY.plants.length} plant${MY.plants.length === 1 ? '' : 's'}</b>${due ? ` · <span class="chip chip-warn">${due} to check</span>` : ''}</div><button type="button" class="btn btn-primary" onclick="MYV.adding=!MYV.adding;mineRefresh()">➕ Add a plant</button></div>
   ${MYV.adding ? `<div class="mp-add"><label class="hg-f"><span>Plant</span><select id="mp-new-plant" class="hg-search"><option value="">Choose…</option>${plantOptions('')}</select></label><label class="hg-f"><span>Nickname (optional)</span><input id="mp-new-nick" class="hg-search" maxlength="40" placeholder="e.g. Kitchen pothos"></label><div class="hg-quick"><button type="button" class="btn btn-primary" onclick="const it=myAdd(document.getElementById('mp-new-plant').value,document.getElementById('mp-new-nick').value);if(it)mineRefresh()">Add</button><button type="button" class="btn" onclick="MYV.adding=false;mineRefresh()">Cancel</button></div></div>` : ''}</section>
  ${list.length ? `<div class="mp-list">${list.map(it => { const p = P(it.plant); return `<div class="mp-item"><a href="#/mine/${it.id}" class="mp-main">${photoBox(p, 'mp-ph', true)}<div><b>${esc(it.nick)}</b><span class="hg-note">${esc(p.name)}${it.room ? ' · ' + esc(it.room) : ''}</span><div class="fchips" style="margin-top:6px">${myStatus(it)}</div></div></a>
     <div class="mp-acts"><button type="button" class="btn" onclick="myLog('${it.id}','water')" aria-label="Log watering for ${esc(it.nick)}">💧 Watered</button><button type="button" class="btn" onclick="myLog('${it.id}','feed')" aria-label="Log feeding for ${esc(it.nick)}">🧪 Fed</button></div></div>`; }).join('')}</div>`
    : '<div class="hg-empty">No plants yet. Add one here, or use “Add to My plants” on any plant page.</div>'}
  <p class="hg-note">“Check the soil” reminders use the interval you set for each plant. They mean “time to check”, not “time to water”: water only when the soil matches the plant’s care sheet.</p>`;
}
function renderMyItem(m, id) {
  const it = myItem(id); if (!it) { m.innerHTML = '<div class="view"><h1>Not in My plants</h1><p><a class="btn" href="#/mine">My plants</a></p></div>'; return; }
  const p = P(it.plant), log = it.log.slice().sort((a, b) => b.d.localeCompare(a.d)), cks = myCheckups(it);
  m.innerHTML = `<div class="view"><button class="hg-back" onclick="nav('#/mine')">← My plants</button>
  <div class="hg-plant-top">${photoBox(p)}<div><h1>${esc(it.nick)}</h1><p class="hg-sci"><a href="#/plant/${p.id}">${esc(p.name)}</a> · ${esc(p.sci)}</p>
   <div class="fchips" style="margin:10px 0">${myStatus(it)}${petChip(p)}</div>
   <div class="hg-quick"><button type="button" class="btn btn-primary" onclick="myLog('${it.id}','water')">💧 Watered today</button><button type="button" class="btn" onclick="myLog('${it.id}','feed')">🧪 Fed today</button><button type="button" class="btn" onclick="myCheckup('${it.id}')">🩺 Run a Checkup</button></div></div></div>
  <div class="hg-grid2">
   <section class="hg-sec"><h2>Details</h2>
    <label class="hg-f"><span>Nickname</span><input class="hg-search" maxlength="40" value="${esc(it.nick)}" onchange="myField('${it.id}','nick',this);mineRefresh()"></label>
    <label class="hg-f" style="margin-top:10px"><span>Room or spot</span><input class="hg-search" maxlength="40" value="${esc(it.room)}" placeholder="e.g. Living room, east window" onchange="myField('${it.id}','room',this)"></label>
    <label class="hg-f" style="margin-top:10px"><span>Remind me to check the soil every … days</span><input class="hg-search" type="number" min="1" max="120" value="${it.interval || ''}" placeholder="No reminder" onchange="myField('${it.id}','interval',this);mineRefresh()"></label>
    <p class="hg-note" style="margin:6px 0 0">${esc(HG.WATER[p.water.style].label)}: ${esc(p.water.note)}</p>
    <label class="hg-f" style="margin-top:10px"><span>Notes</span><textarea class="hg-search" rows="3" maxlength="1000" onchange="myField('${it.id}','notes',this)">${esc(it.notes)}</textarea></label>
    <p class="hg-note">Added ${fmtDate(it.added)}. <a href="javascript:void(0)" onclick="myRemove('${it.id}')">Remove from My plants</a></p></section>
   <section class="hg-sec"><h2>Care log</h2>
    <div class="mp-logadd"><select id="mp-ev-type" class="hg-search" aria-label="Event">${Object.keys(MY_EVENTS).map(k => `<option value="${k}">${MY_EVENTS[k][0]} ${MY_EVENTS[k][1]}</option>`).join('')}</select><input id="mp-ev-date" class="hg-search" type="date" value="${today()}" max="${today()}" aria-label="Date"><input id="mp-ev-note" class="hg-search" maxlength="200" placeholder="Note (optional)" aria-label="Note"><button type="button" class="btn" onclick="myLog('${it.id}',document.getElementById('mp-ev-type').value,document.getElementById('mp-ev-date').value,document.getElementById('mp-ev-note').value)">Add</button></div>
    ${log.length ? `<ul class="mp-log">${log.map(e => `<li><span>${MY_EVENTS[e.type][0]}</span><div><b>${MY_EVENTS[e.type][1]}</b> · ${fmtDate(e.d)} <span class="hg-note">(${ago(daysSince(e.d))})</span>${e.note ? `<br>${esc(e.note)}` : ''}</div><button type="button" class="hg-ibtn" aria-label="Delete entry" onclick="myDelEvent('${it.id}','${e.id}')">✕</button></li>`).join('')}</ul>` : '<p class="hg-note">Nothing logged yet.</p>'}
   </section></div>
  <section class="hg-sec"><h2>Checkups</h2>${cks.length ? `<div class="hg-tbl"><table><thead><tr><th>Date</th>${Object.keys(DIMS).map(k => `<th>${DIMS[k]}</th>`).join('')}<th>Overall</th></tr></thead><tbody>${cks.map(c => `<tr><td>${c.date}</td>${Object.keys(DIMS).map(k => `<td>${c.scores[k] == null ? '–' : c.scores[k] + '/5'}</td>`).join('')}<td><b style="color:${ratingColor(c.pct)}">${c.pct}%</b> ${c.rating}</td></tr>`).join('')}</tbody></table></div>` : `<p class="hg-note">No saved checkups for “${esc(it.nick)}” yet. Checkups saved under this nickname appear here.</p>`}<p><button type="button" class="btn" onclick="myCheckup('${it.id}')">🩺 Run a Checkup</button></p></section></div>`;
  fillPhotos(m); document.title = it.nick + ' · My plants';
}
function cutNext(id) { const c = MY.cuttings.find(x => x.id === id); const i = CUT_STAGES.findIndex(s => !c.stages[s[0]]); if (i >= 0) { c.stages[CUT_STAGES[i][0]] = today(); mySave(); toast(CUT_STAGES[i][1] + ' today'); } mineRefresh(); }
function cutFail(id) { const c = MY.cuttings.find(x => x.id === id); c.failed = c.failed ? null : today(); mySave(); mineRefresh(); }
function cutDel(id) { if (!confirm('Delete this cutting?')) return; MY.cuttings = MY.cuttings.filter(x => x.id !== id); mySave(); mineRefresh(); }
function cutAdd() {
  const plant = document.getElementById('ct-plant').value, method = document.getElementById('ct-method').value, d = document.getElementById('ct-date').value || today();
  if (!P(plant)) return toast('Choose a plant');
  MY.cuttings.push({ id: newId(), plant, method, stages: { start: d }, failed: null, label: document.getElementById('ct-label').value.trim(), notes: '' });
  mySave(); MYV.cutAdding = false; mineRefresh();
}
function cutMethods(pid) { const p = P(pid); const own = p ? p.propagation : []; return own.concat(Object.keys(HG.PROP).filter(k => !own.includes(k))); }
function renderCuttings() {
  const sel = MYV.cutPlant || '', p = P(sel);
  const list = MY.cuttings.slice().sort((a, b) => !!a.failed - !!b.failed || b.stages.start.localeCompare(a.stages.start));
  return `<section class="hg-sec"><div class="mp-bar"><b>${MY.cuttings.length === 1 ? '1 cutting or division' : MY.cuttings.length + ' cuttings and divisions'}</b><button type="button" class="btn btn-primary" onclick="MYV.cutAdding=!MYV.cutAdding;mineRefresh()">➕ Start one</button></div>
   ${MYV.cutAdding ? `<div class="mp-add"><label class="hg-f"><span>Plant</span><select id="ct-plant" class="hg-search" onchange="MYV.cutPlant=this.value;mineRefresh()"><option value="">Choose…</option>${plantOptions(sel)}</select></label>
     <label class="hg-f"><span>Method</span><select id="ct-method" class="hg-search">${cutMethods(sel).map(k => `<option value="${k}">${HG.PROP[k]}${p && p.propagation.includes(k) ? ' (recommended)' : ''}</option>`).join('')}</select></label>
     <label class="hg-f"><span>Label (optional)</span><input id="ct-label" class="hg-search" maxlength="40" placeholder="e.g. From the kitchen pothos"></label>
     <label class="hg-f"><span>Started</span><input id="ct-date" class="hg-search" type="date" value="${today()}" max="${today()}"></label>
     ${p ? `<p class="hg-note">${esc(p.propNote)}</p>` : ''}
     <div class="hg-quick"><button type="button" class="btn btn-primary" onclick="cutAdd()">Start tracking</button><button type="button" class="btn" onclick="MYV.cutAdding=false;mineRefresh()">Cancel</button></div></div>` : ''}</section>
  ${list.length ? list.map(c => { const pp = P(c.plant), next = CUT_STAGES.find(s => !c.stages[s[0]]); return `<div class="hg-sec mp-cut${c.failed ? ' failed' : ''}"><div class="mp-bar"><div><b>${esc(c.label || pp.name)}</b><br><span class="hg-note">${esc(pp.name)} · ${esc(HG.PROP[c.method] || c.method)} · started ${fmtDate(c.stages.start)} (${ago(daysSince(c.stages.start))})</span></div><button type="button" class="hg-ibtn" aria-label="Delete cutting" onclick="cutDel('${c.id}')">✕</button></div>
    <ol class="mp-steps">${CUT_STAGES.map(s => `<li class="${c.stages[s[0]] ? 'done' : ''}"><b>${s[1]}</b><span>${c.stages[s[0]] ? fmtDate(c.stages[s[0]]) : '–'}</span></li>`).join('')}</ol>
    <div class="hg-quick">${c.failed ? `<span class="chip chip-bad">Didn’t make it (${fmtDate(c.failed)})</span><button type="button" class="btn" onclick="cutFail('${c.id}')">Undo</button>` : `${next ? `<button type="button" class="btn btn-primary" onclick="cutNext('${c.id}')">Mark “${next[1]}” today</button>` : '<span class="chip chip-ok">🎉 Established</span>'}${next ? `<button type="button" class="btn" onclick="cutFail('${c.id}')">Didn’t make it</button>` : ''}${c.stages.potted && !c.added ? `<button type="button" class="btn" onclick="const it=myAdd('${c.plant}','${esc((c.label || '').replace(/'/g, ''))}');MY.cuttings.find(x=>x.id==='${c.id}').added=1;mySave();nav('#/mine/'+it.id)">➕ Add to collection</button>` : ''}`}</div></div>`; }).join('')
    : '<div class="hg-empty">No cuttings yet. Start one to track it from cutting to established plant.</div>'}`;
}
function cardToggle(id) { const i = MYV.cards.indexOf(id); if (i >= 0) MYV.cards.splice(i, 1); else MYV.cards.push(id); mineRefresh(); }
function careCard(p, nick) {
  const L = p.light, T = p.temp, ps = petStatus(p);
  return `<div class="care-card"><div class="cc-h"><b>${esc(nick || p.name)}</b><i>${esc(p.sci)}</i></div><dl>
   <dt>☀️ Light</dt><dd>${HG.LIGHT[L.best].label}${L.min < L.best ? '; tolerates ' + HG.LIGHT[L.min].label.toLowerCase() : ''}${L.direct ? '. ' + HG.DIRECT[L.direct] : ''}</dd>
   <dt>💧 Water</dt><dd>${HG.WATER[p.water.style].label}</dd>
   <dt>💨 Humidity</dt><dd>${p.humidity.best ? HG.HUMID[p.humidity.best].label : 'Average room air'}</dd>
   <dt>🌡️ Temp</dt><dd>${T.ideal ? `${T.ideal[0]} to ${T.ideal[1]}°F${T.min != null && T.min < T.ideal[0] ? `; keep above ${T.min}°F` : ''}` : T.min != null ? `Keep above ${T.min}°F` : 'Average room temperature'}</dd>
   <dt>🪨 Mix</dt><dd>${HG.SOILS[p.soil].label}</dd>
   <dt>🐾 Pets</dt><dd>${ps === 'toxic' ? 'Toxic to cats and dogs' : ps === 'nontoxic' ? (p.pets.cats === 'notlisted' ? 'Rated non-toxic (NC State)' : 'Non-toxic (ASPCA)') : 'Unknown'}</dd></dl>
   <p class="cc-tip">${esc(p.tips[0])}</p><p class="cc-f">Houseplant Guide · beneathtrees.org/Houseplant_Guide</p></div>`;
}
function renderCards() {
  const opts = MY.plants.map(it => ({ key: 'my:' + it.id, p: P(it.plant), nick: it.nick })).concat(HG.plants.map(p => ({ key: 'db:' + p.id, p, nick: '' })));
  const chosen = MYV.cards.map(k => opts.find(o => o.key === k)).filter(Boolean);
  return `<section class="hg-sec mp-noprint"><h2>Printable care cards</h2><p>Pick plants, then print. Cards fit four to a page and suit a recipe box, the inside of a cabinet, or a cutting you give away.</p>
   ${MY.plants.length ? `<b>My plants</b><div class="fchips" style="margin:6px 0 12px">${opts.filter(o => o.key.startsWith('my:')).map(o => `<button type="button" class="fchip${MYV.cards.includes(o.key) ? ' on' : ''}" onclick="cardToggle('${o.key}')">${esc(o.nick)}</button>`).join('')}</div>` : ''}
   <details><summary><b>Any plant in the guide</b></summary><div class="fchips" style="margin-top:8px">${opts.filter(o => o.key.startsWith('db:')).map(o => `<button type="button" class="fchip${MYV.cards.includes(o.key) ? ' on' : ''}" onclick="cardToggle('${o.key}')">${esc(o.p.name)}</button>`).join('')}</div></details>
   <div class="hg-quick"><button type="button" class="btn btn-primary" ${chosen.length ? '' : 'disabled'} onclick="window.print()">🖨️ Print ${chosen.length || ''} card${chosen.length === 1 ? '' : 's'}</button>${chosen.length ? `<button type="button" class="btn" onclick="MYV.cards=[];mineRefresh()">Clear</button>` : ''}</div></section>
  <div class="care-cards">${chosen.map(o => careCard(o.p, o.nick)).join('')}</div>`;
}
function myExport() {
  const data = { app: 'houseplant-guide', kind: 'myplants', version: HG.version, exported: today(), plants: MY.plants, cuttings: MY.cuttings, checkups: ckLoad() };
  ckDownload('houseplant-guide-my-plants-' + today() + '.json', JSON.stringify(data, null, 2), 'application/json');
}
function myImport(input) {
  const f = input.files && input.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = e => {
    let j; try { j = JSON.parse(e.target.result); } catch (err) { input.value = ''; return toast('That file is not a Houseplant Guide backup'); }
    if (!j || j.app !== 'houseplant-guide') { input.value = ''; return toast('That file is not a Houseplant Guide backup'); }
    let n = 0; const has = new Set(MY.plants.map(x => x.id)), hasC = new Set(MY.cuttings.map(x => x.id));
    (j.plants || []).forEach(x => { if (x && x.id && P(x.plant) && !has.has(x.id)) { MY.plants.push(Object.assign({ log: [], notes: '', room: '', interval: null }, x)); n++; } });
    (j.cuttings || []).forEach(x => { if (x && x.id && P(x.plant) && x.stages && !hasC.has(x.id)) { MY.cuttings.push(x); n++; } });
    const all = ckLoad(), ids = new Set(all.map(c => c.id)); (j.checkups || []).forEach(c => { if (c && c.app === 'houseplant-guide' && c.id && P(c.plant) && !ids.has(c.id)) { all.push(c); n++; } }); ckSaveAll(all);
    mySave(); input.value = ''; toast(n ? `Imported ${n} item${n > 1 ? 's' : ''}` : 'Nothing new to import'); mineRefresh();
  };
  rd.readAsText(f);
}
function renderBackup() {
  const n = ckLoad().length;
  return `<section class="hg-sec"><h2>Backup and move</h2><p>My plants, cuttings and saved checkups live only in this browser. Clearing site data, or a private window, loses them.</p>
   <ul class="hg-list"><li>${MY.plants.length} plant${MY.plants.length === 1 ? '' : 's'} with ${MY.plants.reduce((a, x) => a + x.log.length, 0)} log entries</li><li>${MY.cuttings.length} cutting${MY.cuttings.length === 1 ? '' : 's'}</li><li>${n} saved checkup${n === 1 ? '' : 's'}</li></ul>
   <div class="hg-quick"><button type="button" class="btn btn-primary" onclick="myExport()">⬇️ Download backup</button><label class="btn" style="cursor:pointer">📂 Restore or merge a backup<input type="file" accept=".json,application/json" hidden onchange="myImport(this)"></label></div>
   <p class="hg-note">Restoring merges: items already here are kept, and nothing is overwritten.</p></section>`;
}
function renderMine(m, id) {
  if (id) return renderMyItem(m, id);
  const body = { collection: renderCollection, cuttings: renderCuttings, cards: renderCards, data: renderBackup }[MYV.tab]();
  m.innerHTML = `<div class="view"><div class="mp-noprint"><h1>My plants</h1><p class="hg-lead">Your collection, care log, cuttings and care cards. Saved in this browser; use Backup to keep a copy.</p>${tabsMine()}</div>${body}</div>`;
  fillPhotos(m); document.title = 'My plants · Houseplant Guide';
}
</script>
