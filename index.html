<style data-file="css/app.css">
/* ═══ Houseplant Guide: botanical print palette (light); dark values below ═══ */
:root{
  --paper:#f5efe0;--paper2:#ece4cf;--card:#fffcf3;--ink:#26261d;--ink2:#46443a;--ink3:#5f5b4c;
  --sage:#4f6b4a;--sage-dk:#34502f;--sage-mid:#7d9a72;--sage-pale:#e4ead6;--moss:#6f7f3b;
  --rust:#8f4a22;--rust-pale:#f6e3d4;--ok:#2f6a3a;--ok-pale:#dfeedd;--warn:#80590b;--warn-pale:#f5ead0;
  --border:#d6ccb2;--border2:#c4b896;--shadow:0 1px 3px rgba(60,50,20,.08),0 4px 14px rgba(60,50,20,.06);
  --r:12px;--head-h:64px;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--f-head:'Fraunces',Georgia,serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#1a1c17;--paper2:#22251e;--card:#252920;--ink:#ece6d3;--ink2:#cfc8b3;--ink3:#aaa38d;
  --sage:#9fbf92;--sage-dk:#c4dab8;--sage-mid:#7f9c74;--sage-pale:#2d3628;--moss:#b4c27a;
  --rust:#eaa577;--rust-pale:#3d2a1e;--ok:#8fd19a;--ok-pale:#20352a;--warn:#e6c372;--warn-pale:#3a3120;
  --border:#3a3f33;--border2:#4b5242;--shadow:0 1px 3px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--sage-dk)}
h1,h2,h3,h4{font-family:var(--f-head);color:var(--ink);line-height:1.2;margin:0 0 .5em;font-weight:600}
h1{font-size:clamp(1.7rem,4vw,2.4rem)}h2{font-size:1.45rem}h3{font-size:1.15rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sage-mid);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
#hg-head{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.hg-head-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:var(--head-h)}
.hg-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0;cursor:pointer;background:none;border:0;padding:0}
.hg-brand svg{width:46px;height:46px;margin:-4px 0}
.hg-brand b{font-family:var(--f-head);font-size:1.3rem;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.hg-brand small{display:block;font-size:.72rem;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.hg-tabs{display:flex;gap:2px;margin-left:auto}
.hg-tab{background:none;border:0;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--ink2);font-size:.95rem}
.hg-tab:hover{background:var(--sage-pale);color:var(--ink)}
.hg-tab.on{background:var(--sage-pale);color:var(--sage-dk);font-weight:600}
.hg-acts{display:flex;gap:6px}
.hg-ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--paper);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.hg-ibtn:hover{border-color:var(--sage-mid)}

/* bottom bar + More sheet (phones) */
#hg-bottom{display:none}
.hg-sheet-wrap{position:fixed;inset:0;background:rgba(20,18,10,.45);z-index:80;display:none;align-items:flex-end}
.hg-sheet-wrap.open{display:flex}
.hg-sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.hg-sheet-grab{width:42px;height:5px;border-radius:3px;background:var(--border2);margin:2px auto 10px}
.hg-sheet button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 10px;border:0;background:none;border-radius:10px;font-size:1rem;text-align:left;cursor:pointer}
.hg-sheet button:hover{background:var(--sage-pale)}
@media (max-width:820px){
  .hg-tabs{display:none}.hg-acts{margin-left:auto}
  #hg-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  #hg-bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:.72rem;color:var(--ink2);border-radius:10px;cursor:pointer}
  #hg-bottom button span{font-size:1.25rem;line-height:1.2}
  #hg-bottom button.on{color:var(--sage-dk);background:var(--sage-pale);font-weight:600}
  main{padding-bottom:84px}
  .hg-brand small{display:none}
}

/* layout */
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.view{animation:hgIn .18s ease}
@keyframes hgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.hg-lead{font-size:1.05rem;color:var(--ink2);max-width:68ch}
.hg-note{font-size:.85rem;color:var(--ink3)}
.hg-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.hg-sec>h2:first-child,.hg-sec>h3:first-child{margin-top:0}
.hg-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--sage)}
.btn-primary{background:var(--sage-dk);border-color:var(--sage-dk);color:#fff}
html[data-theme="dark"] .btn-primary{color:#17200f}
.btn-primary:hover{filter:brightness(1.08)}
.hg-quick{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}

/* home hero: botanical print band */
.hg-hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--border2);background:var(--paper2);padding:34px 28px 30px;margin-bottom:20px}
.hg-hero::before{content:"";position:absolute;inset:10px;border:1px solid var(--border2);border-radius:10px;pointer-events:none}
.hg-hero svg.hg-sprig{position:absolute;right:-10px;bottom:-14px;width:min(340px,48%);height:auto;opacity:.9;pointer-events:none}
.hg-hero>*:not(svg){position:relative;z-index:1}
.hg-hero h1{position:relative;max-width:16ch}
.hg-hero p{position:relative;max-width:52ch}
.hg-hero .hg-eyebrow{position:relative;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-dk);font-weight:600;margin-bottom:8px}
@media (max-width:640px){.hg-hero{padding:24px 18px 120px}.hg-hero svg.hg-sprig{width:200px;opacity:.75}}

/* group cards */
.hg-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.hg-group{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.hg-group:hover{border-color:var(--sage-mid)}
.hg-group>span:not(.hg-gart){font-size:1.6rem}
.hg-group b{display:block}
.hg-group small{color:var(--ink3)}

/* plant cards */
.hg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.hg-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;box-shadow:var(--shadow)}
.hg-card:hover{border-color:var(--sage-mid);transform:translateY(-1px)}
.hg-card .hg-ph{aspect-ratio:4/3}
.hg-card-b{padding:11px 13px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
.hg-card-b b{font-family:var(--f-head);font-size:1.08rem;font-weight:600}
.hg-card-b i{color:var(--ink3);font-size:.86rem}
.hg-card-ic{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* photos */
.hg-ph{position:relative;background:var(--sage-pale);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hg-ph::after{content:"";width:44%;max-width:84px;aspect-ratio:1;background:var(--sage-dk);opacity:.26;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%22-185%20-255%20370%20370%22%3E%3Cg%20transform=%22rotate%28-24%29%22%3E%3Cpath%20d=%22M0%20-6%20Q-6%2040%20-26%2092%22%20stroke=%22%23000%22%20stroke-width=%2214%22%20fill=%22none%22%20stroke-linecap=%22round%22/%3E%3Cpath%20d=%22M-144%20-57%20-142%20-39%20-140%20-28%20-134%20-12%20-129%20-3%20-123%206%20-116%2013%20-108%2018%20-96%2023%20-84%2026%20-72%2027%20-59%2026%20-47%2023%20-36%2018%20-22%2010%20-12%203%20-7%20-2%20-1%20-9%200%20-9%201%20-9%209%201%2015%206%2025%2013%2036%2018%2047%2023%2059%2026%2072%2027%2080%2027%2088%2026%2096%2023%20108%2018%20116%2013%20120%209%20126%202%20132%20-7%20138%20-22%20142%20-39%20144%20-57%2071%20-46%2034%20-39%2030%20-40%2026%20-44%2025%20-48%2026%20-53%2028%20-55%2031%20-57%2050%20-61%20143%20-75%20141%20-90%20138%20-103%20134%20-115%20130%20-124%2073%20-106%2038%20-93%2034%20-93%2030%20-95%2028%20-98%2028%20-102%2029%20-106%2032%20-108%2059%20-118%20122%20-139%20115%20-149%20107%20-159%20100%20-166%2090%20-174%2041%20-147%2038%20-146%2034%20-147%2032%20-150%2031%20-153%2031%20-156%2033%20-159%2050%20-169%2076%20-184%2058%20-194%2040%20-201%2023%20-207%200%20-212%20-23%20-207%20-40%20-201%20-58%20-194%20-76%20-184%20-50%20-169%20-33%20-159%20-31%20-156%20-31%20-153%20-32%20-150%20-34%20-147%20-38%20-146%20-41%20-147%20-90%20-174%20-100%20-166%20-107%20-159%20-115%20-149%20-122%20-139%20-59%20-118%20-32%20-108%20-29%20-106%20-28%20-102%20-28%20-98%20-31%20-95%20-34%20-93%20-38%20-93%20-73%20-106%20-130%20-124%20-134%20-115%20-138%20-103%20-143%20-83%20-143%20-75%20-68%20-64%20-31%20-57%20-28%20-55%20-25%20-51%20-25%20-46%20-28%20-42%20-31%20-40%20-35%20-39%20-71%20-46%20-144%20-57ZM52%20-88%2053%20-86%2053%20-83%2050%20-80%2047%20-78%2044%20-77%2040%20-76%2037%20-77%2035%20-78%2035%20-80%2036%20-83%2038%20-85%2041%20-87%2047%20-89%2050%20-89%2052%20-88ZM-35%20-80%20-36%20-77%20-38%20-76%20-42%20-76%20-45%20-77%20-49%20-79%20-52%20-81%20-53%20-84%20-53%20-87%20-52%20-88%20-49%20-89%20-46%20-89%20-43%20-88%20-37%20-84%20-35%20-82%20-35%20-80Z%22%20fill=%22%23000%22%20fill-rule=%22evenodd%22/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%22-185%20-255%20370%20370%22%3E%3Cg%20transform=%22rotate%28-24%29%22%3E%3Cpath%20d=%22M0%20-6%20Q-6%2040%20-26%2092%22%20stroke=%22%23000%22%20stroke-width=%2214%22%20fill=%22none%22%20stroke-linecap=%22round%22/%3E%3Cpath%20d=%22M-144%20-57%20-142%20-39%20-140%20-28%20-134%20-12%20-129%20-3%20-123%206%20-116%2013%20-108%2018%20-96%2023%20-84%2026%20-72%2027%20-59%2026%20-47%2023%20-36%2018%20-22%2010%20-12%203%20-7%20-2%20-1%20-9%200%20-9%201%20-9%209%201%2015%206%2025%2013%2036%2018%2047%2023%2059%2026%2072%2027%2080%2027%2088%2026%2096%2023%20108%2018%20116%2013%20120%209%20126%202%20132%20-7%20138%20-22%20142%20-39%20144%20-57%2071%20-46%2034%20-39%2030%20-40%2026%20-44%2025%20-48%2026%20-53%2028%20-55%2031%20-57%2050%20-61%20143%20-75%20141%20-90%20138%20-103%20134%20-115%20130%20-124%2073%20-106%2038%20-93%2034%20-93%2030%20-95%2028%20-98%2028%20-102%2029%20-106%2032%20-108%2059%20-118%20122%20-139%20115%20-149%20107%20-159%20100%20-166%2090%20-174%2041%20-147%2038%20-146%2034%20-147%2032%20-150%2031%20-153%2031%20-156%2033%20-159%2050%20-169%2076%20-184%2058%20-194%2040%20-201%2023%20-207%200%20-212%20-23%20-207%20-40%20-201%20-58%20-194%20-76%20-184%20-50%20-169%20-33%20-159%20-31%20-156%20-31%20-153%20-32%20-150%20-34%20-147%20-38%20-146%20-41%20-147%20-90%20-174%20-100%20-166%20-107%20-159%20-115%20-149%20-122%20-139%20-59%20-118%20-32%20-108%20-29%20-106%20-28%20-102%20-28%20-98%20-31%20-95%20-34%20-93%20-38%20-93%20-73%20-106%20-130%20-124%20-134%20-115%20-138%20-103%20-143%20-83%20-143%20-75%20-68%20-64%20-31%20-57%20-28%20-55%20-25%20-51%20-25%20-46%20-28%20-42%20-31%20-40%20-35%20-39%20-71%20-46%20-144%20-57ZM52%20-88%2053%20-86%2053%20-83%2050%20-80%2047%20-78%2044%20-77%2040%20-76%2037%20-77%2035%20-78%2035%20-80%2036%20-83%2038%20-85%2041%20-87%2047%20-89%2050%20-89%2052%20-88ZM-35%20-80%20-36%20-77%20-38%20-76%20-42%20-76%20-45%20-77%20-49%20-79%20-52%20-81%20-53%20-84%20-53%20-87%20-52%20-88%20-49%20-89%20-46%20-89%20-43%20-88%20-37%20-84%20-35%20-82%20-35%20-80Z%22%20fill=%22%23000%22%20fill-rule=%22evenodd%22/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat}
.hg-ph.has::after{display:none}
.hg-ph img{width:100%;height:100%;object-fit:cover;display:block}
.hg-credit{position:absolute;left:0;right:0;bottom:0;font-size:.66rem;line-height:1.3;padding:3px 6px;background:rgba(18,20,12,.72);color:#f4f0e2;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hg-credit:hover{white-space:normal}

/* chips and badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip-ok{background:var(--ok-pale);color:var(--ok)}
.chip-bad{background:var(--rust-pale);color:var(--rust)}
.chip-warn{background:var(--warn-pale);color:var(--warn)}
.chip-n{background:var(--paper2);color:var(--ink2);border-color:var(--border)}
.conf{font-size:.7rem;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:6px;vertical-align:middle}
.conf-verified{background:var(--ok-pale);color:var(--ok)}
.conf-cited{background:var(--warn-pale);color:var(--warn)}
.conf-approx{background:var(--paper2);color:var(--ink3);border:1px solid var(--border)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--border2);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.88rem;color:var(--ink2)}
.fchip.on{background:var(--sage-dk);border-color:var(--sage-dk);color:#fff;font-weight:600}
html[data-theme="dark"] .fchip.on{color:#17200f}

/* browse filters */
.hg-filters{display:grid;gap:12px;margin-bottom:16px}
.hg-f{display:flex;flex-direction:column;gap:6px}
.hg-f>span{font-size:.8rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.hg-search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--card);color:var(--ink);font-size:1rem}
.hg-search::placeholder{color:var(--ink3)}
.hg-count{font-size:.9rem;color:var(--ink3);margin:4px 0 12px}
.hg-empty{padding:30px;text-align:center;color:var(--ink3);border:1px dashed var(--border2);border-radius:var(--r)}
.hg-empty-art{display:block;width:110px;height:auto;margin:0 auto 10px;color:var(--sage-dk);opacity:.85}
.hg-vign{float:right;width:140px;margin:4px 6px 10px 18px;color:var(--sage-dk)}
.hg-vign svg{display:block;width:100%;height:auto}
.hg-learn-body::after{content:"";display:table;clear:both}
.hg-gart{display:flex;width:46px;height:46px;flex:0 0 46px;align-items:center;justify-content:center;border-radius:12px;background:var(--paper2);color:var(--sage-dk);font-size:1.6rem}
.hg-gart svg{width:40px;height:40px}
@media (max-width:640px){.hg-vign{width:104px;margin-left:12px}}

/* plant page */
.hg-back{background:none;border:0;color:var(--sage-dk);cursor:pointer;padding:4px 0;margin-bottom:10px;font-weight:600}
.hg-plant-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start;margin-bottom:18px}
@media (max-width:760px){.hg-plant-top{grid-template-columns:1fr}}
.hg-plant-top .hg-ph{aspect-ratio:4/3;border-radius:var(--r);border:1px solid var(--border)}
.hg-plant-top h1{margin-bottom:2px}
.hg-sci{font-style:italic;color:var(--ink2);font-size:1.05rem;margin:0}
.hg-fam{color:var(--ink3);font-size:.9rem;margin:2px 0 10px}
.hg-aka{color:var(--ink2);font-size:.92rem;margin:6px 0}
.hg-badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.hg-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.hg-facts div{background:var(--paper2);border-radius:9px;padding:8px 10px;font-size:.88rem}
.hg-facts b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}

/* range bars */
.hg-bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.hg-bar h4{font-family:var(--f-body);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:0 0 6px;font-weight:700}
.hg-scale{display:flex;gap:3px}
.hg-scale div{flex:1;height:30px;border-radius:6px;background:var(--paper2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--ink3);text-align:center;line-height:1.1;padding:0 2px}
.hg-scale div.ok{background:var(--sage-pale);color:var(--sage-dk);border-color:var(--sage-mid)}
.hg-scale div.best{background:var(--sage-dk);color:#fff;border-color:var(--sage-dk);font-weight:700}
html[data-theme="dark"] .hg-scale div.best{color:#17200f}
.hg-bar p{margin:6px 0 0;font-size:.88rem;color:var(--ink2)}
.hg-temp{position:relative;height:30px;border-radius:6px;background:linear-gradient(90deg,#7fa7c9,#cfdcc0 45%,#e8c98f 75%,#d98c5f);border:1px solid var(--border)}
html[data-theme="dark"] .hg-temp{background:linear-gradient(90deg,#3d5d78,#4e5e44 45%,#7a6334 75%,#7c4429)}
.hg-temp .band{position:absolute;top:3px;bottom:3px;border:2px solid var(--ink);border-radius:5px;background:rgba(255,255,255,.28)}
.hg-temp .min{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--rust);border-radius:2px}
.hg-temp-ax{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink3);margin-top:3px}

/* sections in plant page */
.hg-care dl{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:8px 16px;margin:0}
.hg-care dt{font-weight:600;color:var(--ink2)}
.hg-care dd{margin:0}
@media (max-width:560px){.hg-care dl{grid-template-columns:1fr}.hg-care dd{margin-bottom:6px}}
.hg-safety{border-left:5px solid var(--rust)}
.hg-varlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hg-varlist li{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.hg-varlist b{margin-right:6px}
.chip-var{background:var(--sage-pale);color:var(--sage-dk)}
.hg-card-v{display:block;margin:4px 0 2px;font-size:.82rem;color:var(--ink2);line-height:1.5}
.pf-box{padding:6px 0}
.pc-tbl td{overflow-wrap:anywhere}
@media (max-width:640px){.pc-tbl thead{display:none}.pc-tbl table,.pc-tbl tbody,.pc-tbl tr,.pc-tbl td{display:block;width:auto}.hg-tbl.pc-tbl tr{border-bottom:1px solid var(--border);padding:8px 0}.hg-tbl.pc-tbl td{border:0;padding:2px 2px}.pc-tbl td:nth-child(2){font-weight:600;color:var(--sage-dk)}}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pf-c{margin:0;border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:6px;display:flex;flex-direction:column;gap:6px}
.pf-c.on{border-color:var(--sage-dk);box-shadow:0 0 0 2px var(--sage-pale) inset}
.pf-c img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--paper2)}
.pf-c figcaption{font-size:.78rem;line-height:1.35;color:var(--ink2);word-break:break-word}
.pf-c figcaption b{color:var(--ink)}
.btn-s{padding:4px 10px;font-size:.82rem;min-height:0}
.hg-ph-tag{position:absolute;left:6px;top:6px;background:rgba(20,24,18,.72);color:#fff;font-size:.68rem;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
.hg-varlist li.on{border-color:var(--sage-dk);box-shadow:0 0 0 2px var(--sage-pale) inset}
.hg-varlist a{color:var(--ink);text-decoration:none}
.hg-varlist a:hover b,.hg-varlist a:focus-visible b{text-decoration:underline}
.hg-var-of{background:var(--sage-pale);border-left:4px solid var(--sage-dk);padding:10px 12px;border-radius:var(--r);margin:10px 0}
.hg-callout{border-left:5px solid var(--rust);background:var(--rust-pale);color:var(--ink);padding:12px 14px;border-radius:var(--r);margin:12px 0 16px;line-height:1.5}
.hg-safety.safe{border-left-color:var(--ok)}
.hg-safety.unk{border-left-color:var(--warn)}
.hg-list{margin:0;padding-left:20px}
.hg-list li{margin:3px 0}
.hg-src li{margin:6px 0}
.hg-xlinks a{display:block;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin:6px 0;text-decoration:none;color:var(--ink)}
.hg-xlinks a:hover{border-color:var(--sage-mid)}
.hg-xlinks b{color:var(--sage-dk)}

/* finder */
.hg-q{margin:0 0 14px}
.hg-q>b{display:block;margin-bottom:6px}
.hg-res{display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);margin:0 0 10px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.hg-res:hover{border-color:var(--sage-mid)}
.hg-res .hg-ph{width:92px;height:92px;border-radius:9px;flex-shrink:0}
.hg-res b{font-family:var(--f-head);font-size:1.1rem}
.hg-res ul{margin:4px 0 0;padding-left:18px;font-size:.88rem;color:var(--ink2)}
.hg-res .why-no{color:var(--rust)}
.hg-score{margin-left:auto;font-weight:700;color:var(--sage-dk);font-size:.95rem;white-space:nowrap}

/* tools hub, learn, help */
.hg-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hg-tool{padding:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.hg-tool:hover{border-color:var(--sage-mid)}
.hg-tool[disabled]{cursor:default;opacity:1;background:var(--paper2)}
.hg-tool span.i{font-size:1.6rem}
.hg-tool b{font-family:var(--f-head);font-size:1.1rem}
.hg-tool small{color:var(--ink2)}
.hg-ltabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.hg-tbl{overflow-x:auto}
.hg-tbl table{width:100%;border-collapse:collapse;font-size:.92rem}
.hg-tbl th,.hg-tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.hg-tbl thead th{background:var(--sage-pale);color:var(--sage-dk)}
.hg-faq{border-bottom:1px solid var(--border);padding:10px 0}
.hg-faq summary{cursor:pointer;font-weight:600}
.hg-faq p{margin:8px 0 0;color:var(--ink2)}
.hg-gloss dt{font-weight:700;margin-top:10px;color:var(--sage-dk)}
.hg-gloss dd{margin:2px 0 0;color:var(--ink2)}
.hg-month{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;border-bottom:1px solid var(--border);padding:10px 0}
.hg-month b{font-family:var(--f-head)}
footer.hg-foot{max-width:1180px;margin:0 auto;padding:10px 16px 40px;color:var(--ink3);font-size:.85rem}
footer.hg-foot a{color:var(--ink2)}
.hg-video{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#111;max-width:720px}
.hg-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hg-vplay{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;margin:0;background:#111;cursor:pointer;display:block}
.hg-vplay img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.hg-vplay .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;border-radius:14px;background:rgba(20,20,20,.82);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.hg-vplay:hover .pl,.hg-vplay:focus-visible .pl{background:#c4302b}
.hg-vplay:focus-visible{outline:3px solid var(--sage);outline-offset:-3px}
.hg-vcap{margin:8px 2px 0;font-size:.92rem;color:var(--ink2)}
.hg-vcap b{color:var(--ink)}
@media print{#hg-head,#hg-bottom,.hg-back,footer.hg-foot,.hg-quick,.hg-vsec{display:none}body{background:#fff}.hg-sec{box-shadow:none;break-inside:avoid}}
/* Plant Checkup */
.ck-n{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--sage-dk);color:#fff;align-items:center;justify-content:center;font-family:var(--f-body);font-size:.9rem;margin-right:6px;vertical-align:2px}
html[data-theme="dark"] .ck-n{color:#17200f}
.ck-overall{display:flex;justify-content:space-between;align-items:center;border:2px solid;border-radius:12px;padding:14px 18px;margin:6px 0 14px;background:var(--paper2)}
.ck-overall small{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--ink3)}
.ck-overall b{display:block;font-family:var(--f-head);font-size:1.6rem}
.ck-overall strong{font-size:2.1rem;font-family:var(--f-head)}
.ck-dims{display:grid;gap:8px}
.ck-dim{display:grid;grid-template-columns:minmax(120px,170px) 1fr 70px;gap:10px;align-items:center;font-size:.92rem}
.ck-dim em{font-style:normal;font-weight:700;text-align:right;color:var(--ink2)}
.ck-track{height:12px;border-radius:6px;background:var(--paper2);border:1px solid var(--border);overflow:hidden}
.ck-track i{display:block;height:100%}
.ck-h{margin:16px 0 6px;font-family:var(--f-body);font-size:1rem}
.ck-h.bad{color:var(--rust)}.ck-h.warn{color:var(--warn)}.ck-h.good{color:var(--ok)}
.ck-watch{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:9px 12px;border-radius:9px;margin:6px 0;border-left:4px solid var(--border2);background:var(--paper2);font-size:.92rem}
.ck-watch.ck-days{border-left-color:var(--rust);background:var(--rust-pale)}
.ck-watch.ck-weeks{border-left-color:var(--warn);background:var(--warn-pale)}
.ck-watch.ck-season{border-left-color:var(--sage)}
@media (max-width:560px){.ck-watch{grid-template-columns:1fr;gap:2px}.ck-dim{grid-template-columns:110px 1fr 60px}}
.ck-up{color:var(--ok)}.ck-down{color:var(--rust)}.ck-same{color:var(--warn)}
select.hg-search{appearance:auto}
/* What's wrong? and Pest ID */
.ww-syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ww-sym{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border2);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;font-size:.9rem;color:var(--ink)}
.ww-sym span{font-size:1.2rem}
.ww-sym.on{background:var(--sage-dk);border-color:var(--sage-dk);color:#fff;font-weight:600}
html[data-theme="dark"] .ww-sym.on{color:#17200f}
.ww-cause{padding:14px 16px}
.ww-ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:4px}
.ww-ch b{font-family:var(--f-head);font-size:1.08rem}
a.fchip{text-decoration:none}
/* My plants */
.mp-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mp-add{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.mp-add .hg-quick,.mp-add p{grid-column:1/-1;margin:0}
.mp-list{display:grid;gap:10px}
.mp-item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.mp-main{display:flex;gap:12px;align-items:center;flex:1 1 300px;text-decoration:none;color:var(--ink);min-width:0}
.mp-main b{display:block;font-family:var(--f-head);font-size:1.1rem}
.mp-main .hg-note{display:block}
.mp-ph{width:72px;height:72px;border-radius:10px;flex-shrink:0}
.mp-acts{display:flex;gap:6px;flex-wrap:wrap}
.mp-acts .btn{padding:8px 12px;font-size:.88rem}
.mp-logadd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mp-logadd input[type=text],.mp-logadd #mp-ev-note{grid-column:1/-1}
.mp-logadd .btn{grid-column:1/-1;justify-content:center}
.mp-log{list-style:none;margin:0;padding:0}
.mp-log li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border)}
.mp-log li .hg-ibtn{width:30px;height:30px;font-size:.8rem}
textarea.hg-search{font:inherit;resize:vertical}
.mp-steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0;padding:0;counter-reset:st}
.mp-steps li{border-top:4px solid var(--border2);padding-top:6px;font-size:.85rem;display:flex;flex-direction:column}
.mp-steps li.done{border-top-color:var(--sage-dk)}
.mp-steps li span{color:var(--ink3);font-size:.8rem}
.mp-cut.failed{opacity:.75}
.mp-cut>.mp-bar{flex-wrap:nowrap;align-items:flex-start}
@media (max-width:560px){.mp-steps{grid-template-columns:repeat(2,1fr)}}
.care-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.care-card{border:2px solid var(--sage-dk);border-radius:12px;padding:14px 16px;background:var(--card);break-inside:avoid}
.cc-h{border-bottom:1px solid var(--border2);padding-bottom:6px;margin-bottom:8px}
.cc-h b{display:block;font-family:var(--f-head);font-size:1.25rem}
.cc-h i{color:var(--ink2);font-size:.9rem}
.care-card dl{display:grid;grid-template-columns:96px 1fr;gap:3px 8px;margin:0;font-size:.9rem}
.care-card dt{font-weight:600;color:var(--ink2)}
.care-card dd{margin:0}
.cc-tip{font-size:.85rem;margin:8px 0 0;color:var(--ink2)}
.cc-f{font-size:.7rem;color:var(--ink3);margin:8px 0 0}
@media print{.mp-noprint{display:none!important}.care-cards{grid-template-columns:1fr 1fr;gap:10px}.care-card{border-color:#34502f;background:#fff;color:#000}.care-card *{color:#000!important}}
</style>
</head>

// ── Browse ──
function brMatch(x) {
  const p = x.isVar ? x.parent : x, t = BR.q.toLowerCase().trim();
  if (t && !t.split(/\s+/).every(w => [x.name, x.sci, p.name, p.sci, p.family, ...(p.aka || []), HG.GROUPS[p.group].label].join(' ').toLowerCase().includes(w))) return false;
  if (BR.group && p.group !== BR.group) return false;
  if (BR.light && !(p.light.min <= +BR.light && +BR.light <= Math.max(p.light.best, p.light.min))) return false;
  if (BR.pets && petStatus(p) !== 'nontoxic') return false;
  if (BR.diff && p.difficulty !== BR.diff) return false;
  if (BR.water && p.water.style !== BR.water) return false;
  if (BR.vari && !isVariegated(x)) return false;
  return true;
}
function brSet(k, v) { BR[k] = BR[k] === v ? (typeof v === 'boolean' ? false : '') : v; renderBrowse(document.getElementById('main'), true); }

// ── Plant finder ──
const FINDER_Q = [
  ['light', 'How much light does the spot get?', [['1', 'Low: north window or well back from a window'], ['2', 'Medium: east window, or near a west window out of the sun'], ['3', 'High: a bright south or west window'], ['sun', 'Direct sun for several hours']]],
  ['pets', 'Do cats or dogs share the space?', [['yes', 'Yes'], ['no', 'No']]],
  ['water', 'How do you water?', [['forget', 'I forget for a week or two'], ['normal', 'About weekly'], ['often', 'Often: I like to check daily']]],
  ['air', 'How humid is the room?', [['dry', 'Dry (heated or air-conditioned)'], ['avg', 'Average'], ['humid', 'Humid: bathroom, kitchen or terrarium']]],
  ['exp', 'Your experience', [['new', 'New to houseplants'], ['some', 'Kept a few alive'], ['lots', 'Experienced']]]
];
function fdPick(k, v) { FD[k] = FD[k] === v ? '' : v; renderFinder(document.getElementById('main')); }
function fdScore(p) {
  let s = 100; const why = [], no = [];
  const lv = FD.light === 'sun' ? 3 : +FD.light;
  if (lv) {
    if (lv < p.light.min) { s -= 70; no.push('Needs more light than this spot gets'); }
    else if (FD.light === 'sun' && p.light.direct === 'avoid') { s -= 45; no.push('Direct sun can scorch it'); }
    else if (lv === p.light.best || (FD.light === 'sun' && p.light.direct === 'needs')) { why.push(FD.light === 'sun' && p.light.direct === 'needs' ? 'Wants the direct sun this spot gets' : 'This is its best light level'); }
    else if (lv > p.light.best) { s -= 8; why.push('Tolerates this much light'); } else { s -= 12; why.push('Tolerates this light, though it prefers more'); }
  }
  if (FD.pets === 'yes') { const ps = petStatus(p); if (ps === 'toxic') { s -= 80; no.push('Toxic to cats or dogs'); } else if (ps === 'unknown') { s -= 30; no.push('Pet safety unknown'); } else why.push(p.pets.cats === 'notlisted' ? 'Rated non-toxic (NC State Extension)' : 'On the ASPCA non-toxic list'); }
  const ws = p.water.style;
  if (FD.water === 'forget') { if (ws === 'dry') why.push('Forgiving if you forget to water'); else if (ws === 'partial') s -= 8; else if (ws === 'moist') { s -= 30; no.push('Needs steady moisture'); } else { s -= 60; no.push('Must never dry out'); } }
  if (FD.water === 'often') { if (ws === 'dry') { s -= 25; no.push('Frequent watering rots it'); } else if (ws === 'moist' || ws === 'wet') why.push('Likes frequent attention to water'); }

  if (FD.exp === 'new') { if (p.difficulty === 'challenging') { s -= 40; no.push('Challenging for a first plant'); } else if (p.difficulty === 'moderate') s -= 12; else why.push('Easy to grow'); }
  if (FD.exp === 'some' && p.difficulty === 'challenging') s -= 12;
  if (p.water.style === 'aquatic') { s -= 10; }
  return { s: Math.max(0, Math.min(100, s)), why, no };
}

  m.innerHTML = `<div class="view"><h1>Plant finder</h1><p class="hg-lead">Answer what you can about the spot and your routine. Plants are ranked by how well they fit; tap one for its full care.</p>

   ${poor.length ? `<details class="hg-sec" style="margin-top:12px"><summary><b>${poor.length} not suited</b>, and why</summary>${poor.map(row).join('')}</details>` : ''}` : '<div class="hg-empty">Pick an answer to see matching plants.</div>'}</section></div></div>`;
  fillPhotos(m);

// ── Learn ──
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const LEARN_TABS = [['light', '☀️ Light'], ['water', '💧 Watering'], ['humidity', '💨 Humidity'], ['soil', '🪨 Potting mixes'], ['pets', '🐾 Pet safety'], ['seasons', '🗓️ Seasons'], ['glossary', '📖 Glossary']];

  ['Aroid', 'A plant in the arum family (Araceae): pothos, philodendrons, monstera, anthuriums, peace lilies, ZZ plants and Chinese evergreens.'],
  ['Calcium oxalate', 'Needle-like crystals in the sap of many aroids. Chewing releases them and causes burning and swelling of the mouth.'],
  ['Division', 'Splitting one plant into several, each with roots and shoots.'],
  ['Dormancy', 'A seasonal rest when a plant grows slowly or not at all and needs less water and no feeding.'],
  ['Epiphyte', 'A plant that grows on another plant (usually a tree) for support, not as a parasite. Orchids, many hoyas and Christmas cactus.'],
  ['Etiolation', 'Pale, stretched growth caused by too little light.'],
  ['Foot-candle', 'A unit of light on a surface; 1 foot-candle is about 10.8 lux. Extension services use it to define low, medium and high light.'],
  ['Leggy', 'Long bare stems with few leaves, usually from too little light.'],
  ['Cultivar', 'A named variety kept going by people, usually from cuttings, such as pothos ‘Marble Queen’. Written in single quotes after the species name.'],
  ['Variegated', 'Leaves with patches, streaks or speckles of white, cream, yellow or pink where the leaf has little or no chlorophyll. Variegated plants usually need brighter light and grow more slowly than plain green ones.'],
  ['Reverting', 'When a variegated plant puts out plain green growth. Growers usually cut the stem back to the last well-variegated leaf, since green shoots grow faster and can take over.'],
  ['Node', 'The point on a stem where a leaf joins. Roots and new shoots grow from nodes, so a cutting needs at least one.'],
  ['Offset', 'A small plant that forms at the base of its parent (a pup), as on aloe and echeveria.'],
  ['Peduncle', 'A flower stalk. On hoyas it is a short spur that blooms again for years, so it should not be cut off.'],

  ['Saponins', 'Soapy plant compounds that cause vomiting and diarrhea if eaten; found in snake plants, dracaenas and aloe.'],
  ['Spathe', 'The hood-like leaf around an aroid flower spike, such as the white "petal" of a peace lily.'],
  ['Stolon', 'A runner: a horizontal stem that forms new plants, as on spider plants.'],

function renderLearn(m, tab) {

  const tabs = `<div class="hg-ltabs fchips">${LEARN_TABS.map(t => `<button type="button" class="fchip${t[0] === tab ? ' on' : ''}" onclick="nav('#/learn/${t[0]}')">${t[1]}</button>`).join('')}</div>`;
  const byWater = w => HG.plants.filter(p => p.water.style === w).map(p => `<a href="#/plant/${p.id}">${esc(p.name)}</a>`).join(', ');
  const body = {
    light: `<section class="hg-sec"><h2>How much light is "low", "medium" and "high"?</h2><p>The human eye is a poor judge of light, so extension services measure it in foot-candles. A free phone light-meter app gives a usable reading in lux: hold the phone where the leaves are, facing the window.</p>
      <div class="hg-tbl"><table><thead><tr><th>Level</th><th>Foot-candles</th><th>Lux</th><th>Where you find it</th></tr></thead><tbody>${[1, 2, 3].map(l => `<tr><th>${HG.LIGHT[l].label}</th><td>${HG.LIGHT[l].fc}</td><td>${HG.LIGHT[l].lux}</td><td>${HG.LIGHT[l].where}</td></tr>`).join('')}</tbody></table></div>
      <p class="hg-note">Foot-candle ranges and window guidance: University of Minnesota and University of Missouri Extension. Lux figures are converted (1 foot-candle = 10.76 lux).</p></section>
      <section class="hg-sec"><h2>Grow lights</h2><ul class="hg-list"><li>With no window light, run lights 16 to 18 hours a day; with some daylight, 12 to 14 hours may be enough (University of Missouri).</li><li>Keep foliage plants 12 to 24 in below the light and flowering plants 6 to 12 in (University of Minnesota).</li><li>Light drops quickly with distance, so a plant a few feet farther away gets much less.</li></ul></section>`,
    water: `<section class="hg-sec"><h2>The five watering styles</h2><p>Every plant page uses one of these. Overwatering kills more houseplants than anything else: roots need air as well as water.</p>${Object.keys(HG.WATER).map(w => `<h3>${HG.WATER[w].label}</h3><p>${HG.WATER[w].how}</p><p class="hg-note">${byWater(w) || 'None yet.'}</p>`).join('')}</section>
      <section class="hg-sec"><h2>Good habits</h2><ul class="hg-list"><li>Use pots with drainage holes and empty the saucer after watering.</li><li>Most plants need less water in winter, when growth slows.</li><li>Use room-temperature water: some plants, such as hoyas and Chinese evergreens, react badly to cold water.</li><li>Spider plants, dracaenas and calatheas brown at the tips from fluoride and chlorine in tap water; rain or distilled water helps.</li></ul><p class="hg-note">These points restate guidance on the individual plant pages.</p></section>`,
    humidity: `<section class="hg-sec"><h2>Humidity</h2><p>Heated winter air is often very dry. Plants marked "Humid" want 60% or more; most others do fine in average rooms.</p><ul class="hg-list"><li><b>Raise it:</b> a humidifier works best; a tray of wet pebbles under the pot helps a little; grouping plants helps; kitchens and bathrooms are naturally humid.</li><li><b>Signs of dry air:</b> brown, crispy leaf edges and tips, and more spider mites.</li><li><b>Terrariums:</b> a closed jar holds humidity for plants like nerve plant.</li></ul><p class="hg-note">${confBadge('approx')} Summary of advice on the plant pages; a cheap hygrometer tells you what you actually have.</p></section>`,
    soil: `<section class="hg-sec"><h2>Potting mixes</h2><p>Each plant page names one of these mixes. Ingredient ratios vary between growers, so treat them as starting points.</p>${Object.keys(HG.SOILS).filter(k => k !== 'none').map(k => `<h3>${HG.SOILS[k].label} ${HG.SOILS[k].conf ? confBadge('approx') : ''}</h3><p>${HG.SOILS[k].recipe}</p><p class="hg-note">${HG.plants.filter(p => p.soil === k).map(p => `<a href="#/plant/${p.id}">${esc(p.name)}</a>`).join(', ')}</p>`).join('')}<p class="hg-note">The orchid and carnivorous plant mixes follow NC State Extension and the International Carnivorous Plant Society; the others are common grower practice.</p></section>`,
    pets: `<section class="hg-sec"><h2>Pet safety</h2><p>Ratings come from the ASPCA Animal Poison Control lists for cats and dogs. When a plant is not on those lists, the guide says so and gives NC State Extension’s rating instead, marked with an asterisk.</p>
      <div class="hg-callout"><b>The most dangerous ones in this guide:</b> <a href="#/plant/easter-lily">Easter lily</a> and other true lilies, for cats (all parts, even pollen and vase water, can cause kidney failure; the ASPCA says it is often fatal if treatment waits more than 18 hours), and the <a href="#/plant/sago-palm">sago palm</a>, for cats and dogs (any part can cause liver failure).</div>
      <div class="hg-tbl"><table><thead><tr><th>Plant</th><th>Cats</th><th>Dogs</th><th>Note</th></tr></thead><tbody>${HG.plants.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<tr><td><a href="#/plant/${p.id}">${esc(p.name)}</a></td><td>${HG.PETS[p.pets.cats]}</td><td>${HG.PETS[p.pets.dogs]}</td><td>${petChip(p)}</td></tr>`).join('')}</tbody></table></div>
      <p>Non-toxic does not mean edible: any plant can upset a pet’s stomach. If a pet eats a plant, call your veterinarian or the ASPCA Animal Poison Control Center at (888) 426-4435.</p></section>`,
    seasons: `<section class="hg-sec"><h2>Through the year (Northern Hemisphere)</h2><p>${confBadge('approx')} General guidance; plant-specific dates come from the plant pages.</p>${[

        ['March to May', 'Growth restarts. Repot plants that have outgrown their pots (peace lily in February or March), prune hoyas in early spring, and resume feeding.'],
        ['June to August', 'Peak growth. Many plants can summer outdoors in shade; bird of paradise likes a sunny to part-shade spot once it is above 70°F.'],
        ['September to November', 'Bring plants in before nights fall below 50 to 55°F, checking for pests first. Give Christmas cactus long nights from mid-September to mid-November, and large moth orchids a week of 55°F nights in autumn to start a flower spike.']
      ].map(x => `<div class="hg-month"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</section>`,
    glossary: `<section class="hg-sec"><h2>Glossary</h2><dl class="hg-gloss">${GLOSSARY.slice().sort((a, b) => a[0].localeCompare(b[0])).map(g => `<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl></section>`
  }[tab];
  const vk = HG.LEARN_VIDEO && HG.LEARN_VIDEO[tab];
  const art = HG_ART.learn[tab] ? `<div class="hg-vign" aria-hidden="true"><svg viewBox="0 0 120 92">${HG_ART.learn[tab]}</svg></div>` : '';
  m.innerHTML = `<div class="view"><h1>Learn</h1><p class="hg-lead">The basics behind every care sheet.</p>${tabs}<div class="hg-learn-body">${art ? body.replace(/(<section[^>]*>)/, '$1' + art) : body}</div>${vk ? videoBox(vk, tab === 'humidity' ? '▶️ Video: building a terrarium' : '▶️ Video') : ''}</div>`;
}

// ── Tools hub ──
const TOOLS = [
  ['finder', '🔎', 'Plant finder', 'Plants ranked for your light, pets, watering habits, humidity and experience.', '#/finder'],
  ['checkup', '🩺', 'Plant Checkup', 'Score a plant’s spot and routine, with early warnings, a saved history and downloadable reports.', '#/checkup'],
  ['wrong', '🍂', 'What’s wrong with my plant?', 'A step-by-step symptom checker for yellow leaves, brown tips, drooping and leaf drop.', '#/whatswrong'],

function renderTools(m) {

// ── Sources ──
function renderSources(m) {
  const types = { extension: 'University extension', toxicity: 'Pet toxicity (ASPCA)', society: 'Specialist societies', government: 'Government', research: 'Research', hobby: 'Hobby sites' };
  m.innerHTML = `<div class="view"><h1>Sources</h1><p class="hg-lead">Where every care fact comes from. <b>Verified</b> means the page was read and matches the guide on the date of the last update.</p>
  ${Object.keys(types).map(t => { const l = HG.sources.filter(s => s.type === t); return l.length ? `<section class="hg-sec"><h2>${types[t]}</h2><ul class="hg-list hg-src">${l.map(s => { const used = HG.plants.filter(p => p.sources.includes(s.id)); return `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>, ${esc(s.publisher)} ${confBadge(s.checked)}${s.note ? `<br><span class="hg-note">${esc(s.note)}</span>` : ''}${used.length && used.length < 10 ? `<br><span class="hg-note">Used for: ${used.map(p => `<a href="#/plant/${p.id}">${esc(p.name)}</a>`).join(', ')}</span>` : ''}</li>`; }).join('')}</ul></section>` : ''; }).join('')}
  <section class="hg-sec"><h2>How the guide handles uncertainty</h2><ul class="hg-list"><li>Care panels use only what the cited source states; "Not stated in the source" is used rather than a guess.</li><li>"More detail" notes and potting-mix recipes that come from common grower practice are marked <b>Approximate</b>.</li><li>Where sources disagree (for example, Venus flytrap dormancy), both views are given.</li></ul></section></div>`;
}

// ── Help ──
const FAQ = [
  ['Does this guide work offline?', 'Yes. Once loaded, everything except the photos and the outside links works without a connection, and photos you have seen are remembered for 30 days.'],
  ['Why does a plant show "Not stated in the source"?', 'The guide fills care fields only with what a cited source says. Blank spots will fill in as more sources are checked.'],
  ['What does the asterisk on a pet-safety badge mean?', 'The plant is not on the ASPCA lists, so the rating comes from NC State Extension instead.'],
  ['Where do the photos come from?', 'Wikimedia Commons (through Wikipedia) first, then iNaturalist, using only freely licensed photos, each credited on the image. A photo is shown only when its page or file name matches the plant’s scientific name. Named varieties use only photos filed under the variety’s own name, so some have none yet. Help → Photo check lists every result and can download them as a file.'],
  ['Why do only some pages have videos?', 'Videos come only from trusted organizations (so far the Royal Horticultural Society), and each link is checked before it is added and again every month. Nothing loads from YouTube until you press play.'],
  ['Are the seasons right for me?', 'Months are for the Northern Hemisphere. South of the equator, shift them by six months.'],
  ['Where are saved checkups kept?', 'In this browser only. Use "Download data" on a result to keep a copy, and "Import saved checkups" to load it on another device or browser.'],
  ['Do reminders notify me?', 'No. The guide has no account or server, so it cannot send notifications. Plants due for a soil check are flagged when you open My plants or the home page.'],
  ['Can I print a care sheet?', 'Yes: open a plant and use "Print care sheet". The menus are hidden in print.']
];
function renderHelp(m) {
  m.innerHTML = `<div class="view"><h1>Help and FAQ</h1><div class="hg-grid2">
  <section class="hg-sec"><h2>Using the guide</h2><ul class="hg-list"><li><b>Plants:</b> search and filter by group, light, watering, pet safety and difficulty.</li><li><b>Plant pages:</b> range bars at the top, then care, pet safety, propagation, problems, tips, collector detail and sources.</li><li><b>Plant finder:</b> answer a few questions about a spot to see ranked matches with reasons.</li><li><b>Plant Checkup:</b> pick a plant, describe its spot and routine, and get scores, fixes and early warnings. Save checkups to see progress over time, or download a report and a data file.</li><li><b>What’s wrong?:</b> pick a symptom and answer a few questions to see likely causes and fixes.</li><li><b>Pest ID:</b> tick what you see to identify a pest, then follow the control steps from gentlest to strongest.</li><li><b>My plants:</b> keep your collection with a care log and soil-check reminders, track cuttings from start to established, print care cards, and back everything up to a file.</li><li><b>Learn:</b> light levels, watering styles, humidity, potting mixes, pet safety, seasons and a glossary.</li><li><b>Theme:</b> the ${'🖥️'} button switches between automatic, dark and light.</li></ul></section>
  <section class="hg-sec"><h2>Questions</h2>${FAQ.map(q => `<details class="hg-faq"><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</section></div>
  <section class="hg-sec"><h2>Photo check</h2><p>Looks up a photo for every plant again and shows where each one came from, or why none was found.</p><button class="btn" onclick="photoCheck()">🔍 Check photos</button><div id="photo-check" style="margin-top:12px"></div></section>
  <section class="hg-sec hg-xlinks"><h2>Other guides</h2>${Object.keys(HG.APPS).map(k => `<a href="${HG.APPS[k].url}" target="_blank" rel="noopener"><b>${HG.APPS[k].name}</b><br><span class="hg-note">${HG.APPS[k].why}</span></a>`).join('')}<a href="https://beneathtrees.org/" target="_blank" rel="noopener"><b>All beneathtrees.org guides</b></a></section></div>`;
}

// ── Router ──
function parseHash() {
  const h = (location.hash || '#/').replace(/^#\/?/, ''), parts = h.split('/');
  const v = parts[0] || 'home';
  if (v === 'plant') return { view: 'plant', id: parts[1], vid: parts[2] || null };
  if (v === 'learn') return { view: 'learn', tab: parts[1] || 'light' };
  if (v === 'checkup') return { view: 'checkup', id: parts[1] || null };
  if (v === 'whatswrong') return { view: 'whatswrong', id: parts[1] || null };
  if (v === 'pests') return { view: 'pests', id: parts[1] || null };
  if (v === 'mine') return { view: 'mine', id: parts[1] || null };
  return { view: ['home', 'plants', 'finder', 'tools', 'sources', 'help'].includes(v) ? v : 'home' };
}
function artEmpty(root) { (root || document).querySelectorAll('.hg-empty:not([data-art])').forEach(el => { el.dataset.art = '1'; el.insertAdjacentHTML('afterbegin', `<svg class="hg-empty-art" viewBox="0 0 120 90" aria-hidden="true">${HG_ART.empty}</svg>`); }); }
function route() {
  const r = parseHash(); Object.assign(S, { view: r.view, id: r.id || null, vid: r.vid || null, tab: r.tab || null });
  const m = document.getElementById('main'); document.title = 'Houseplant Guide';
  ({ home: renderHome, plants: renderBrowse, plant: x => renderPlant(x, S.id, S.vid), finder: renderFinder, checkup: x => renderCheckup(x, S.id), whatswrong: x => renderWhatsWrong(x, S.id), pests: x => renderPests(x, S.id), mine: x => renderMine(x, S.id), learn: x => renderLearn(x, S.tab), tools: renderTools, sources: renderSources, help: renderHelp })[S.view](m);
  fillPhotos(m);
  const tabOf = { plant: 'plants', sources: 'more', help: 'more', tools: 'tools', checkup: 'tools', whatswrong: 'tools', pests: 'tools' }[S.view] || S.view;
  document.querySelectorAll('.hg-tab').forEach(b => b.classList.toggle('on', b.dataset.v === tabOf || (S.view === 'plant' && b.dataset.v === 'plants')));
  document.querySelectorAll('#hg-bottom button').forEach(b => b.classList.toggle('on', b.dataset.v === (tabOf === 'tools' || tabOf === 'finder' ? 'more' : tabOf)));
  if (!S.keepScroll) window.scrollTo(0, 0);
  S.rendered = true;
}
function hgMore(open) { document.getElementById('hg-more').classList.toggle('open', open); }
function hgInit() {
  document.getElementById('hg-more').addEventListener('click', e => { if (e.target.id === 'hg-more') hgMore(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hgMore(false); });
  window.addEventListener('hashchange', route);
  { const v = document.getElementById('hg-ver'); if (v) v.textContent = HG.version; }
  { const mm = document.getElementById('main'); let q = false; new MutationObserver(() => { if (!q) { q = true; queueMicrotask(() => { q = false; artEmpty(mm); }); } }).observe(mm, { childList: true, subtree: true }); }
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const f = () => hgThemeApply(); if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f); }
  hgThemePaint(); route();
}
document.addEventListener('DOMContentLoaded', hgInit);
</script>
<script data-file="js/checkup.js">
// ═════════════════════════════════════════════════════════════════
// PLANT CHECKUP: scores one plant's spot and routine against its sourced needs,
// warns about what is likely to go wrong next, and keeps a history on this device.
// ═════════════════════════════════════════════════════════════════
const CK_KEY = 'hg.checkups.v1', CK_LAST = 'hg.checkup.last.v1';
const CK_BLANK = { plant: '', nick: '', where: 'indoors', lightHow: 'window', dir: '', dist: '', sun: '', meter: '', meterUnit: 'lux', growHrs: '',
  soilState: '', decide: '', hole: '', saucer: '', waterType: '', pot: '', mix: '', change: '',
  air: '', rh: '', nightF: '', drafts: '', feed: '', roots: '', nightLight: '', pets: '', symptoms: [] };
let CK = Object.assign({}, CK_BLANK, { symptoms: [] }), CK_RES = null;
const ckLoad = () => { try { return JSON.parse(localStorage.getItem(CK_KEY) || '[]') || []; } catch (e) { return []; } };
const ckSaveAll = a => { try { localStorage.setItem(CK_KEY, JSON.stringify(a)); return true; } catch (e) { return false; } };
const ckMonth = () => new Date().getMonth() + 1;
const DIRS = [['S', 'South'], ['SW', 'Southwest'], ['W', 'West'], ['SE', 'Southeast'], ['E', 'East'], ['NE', 'Northeast'], ['N', 'North'], ['NW', 'Northwest']];
const DIR_LV = { S: 3, SW: 3, W: 3, SE: 2, E: 2, NE: 1, N: 1, NW: 1 };
const DIST = [['0-3', 'Within 3 ft'], ['3-6', '3 to 6 ft'], ['6-10', '6 to 10 ft'], ['10+', 'More than 10 ft']];
const DIST_DROP = { '0-3': 0, '3-6': 1, '6-10': 2, '10+': 3 };
const SYMPTOMS = [['yellow', 'Yellowing leaves'], ['browntips', 'Brown or crispy tips and edges'], ['droop', 'Drooping or wilting'], ['drop', 'Leaves falling off'], ['leggy', 'Pale, stretched or leggy growth'], ['spots', 'Spots on leaves'], ['mushy', 'Mushy stems or base'], ['pests', 'Insects, webbing or sticky residue']];
const MIX_OPTS = [['standard', 'All-purpose potting mix'], ['rich', 'Rich, moisture-holding mix'], ['chunky', 'Chunky mix with bark or perlite'], ['gritty', 'Cactus or gritty mix'], ['bark', 'Orchid bark'], ['cp', 'Peat or sphagnum (carnivorous mix)'], ['garden', 'Garden soil'], ['unknown', 'Not sure']];
const PURE_WATER = ['venus-flytrap', 'cape-sundew'], FLUORIDE = ['spider-plant', 'dracaena-janet-craig', 'calathea-orbifolia', 'anthurium-clarinervium'];
const LIKES_POTBOUND = ['hoya-carnosa', 'hoya-kerrii', 'peace-lily'];

function ckLight() {
  // Returns {lv: 0..3, how, note}. 0 means darker than the low-light range (under 50 foot-candles).
  if (CK.lightHow === 'meter') { const v = parseFloat(CK.meter); if (!(v >= 0)) return null; const fc = CK.meterUnit === 'lux' ? v / 10.764 : v;
    return { lv: fc < 50 ? 0 : fc < 250 ? 1 : fc < 1000 ? 2 : 3, how: 'meter', note: `${Math.round(fc).toLocaleString()} foot-candles measured` }; }
  if (CK.lightHow === 'grow') { const h = parseFloat(CK.growHrs); if (!(h > 0)) return null; return { lv: h >= 14 ? 3 : h >= 10 ? 2 : 1, how: 'grow', note: `Grow light ${h} hours a day` }; }
  if (!CK.dir || !CK.dist) return null;
  return { lv: Math.max(0, DIR_LV[CK.dir] - DIST_DROP[CK.dist]), how: 'window', note: `Estimated from a ${DIRS.find(d => d[0] === CK.dir)[1].toLowerCase()} window, ${DIST.find(d => d[0] === CK.dist)[1].toLowerCase()}` };
}
const LVNAME = l => l === 0 ? 'very low (under 50 foot-candles)' : HG.LIGHT[l].label.toLowerCase();

function ckScore() {
  const p = P(CK.plant); if (!p) return null;
  const m = ckMonth(), winter = [11, 12, 1, 2].includes(m), good = [], warn = [], bad = [], watch = [], safety = [];
  const sc = { light: 5, water: 5, soil: 5, climate: 5, health: 5 };
  const aquatic = p.water.style === 'aquatic', wet = p.water.style === 'wet';
  // ── Light ──
  const L = ckLight();
  if (!L) { sc.light = null; } else {
    if (L.lv === 0) { sc.light = 1; bad.push(`Too dark: ${L.note}. Even low-light plants struggle below about 50 foot-candles. Move it closer to a window or add a grow light.`); }
    else if (L.lv < p.light.min) { sc.light = 1.5; bad.push(`Not enough light: the spot is ${LVNAME(L.lv)}, but ${p.name} needs at least ${HG.LIGHT[p.light.min].label.toLowerCase()} light.`); }
    else if (L.lv < p.light.best) { sc.light = 3.5; warn.push(`It will survive in ${LVNAME(L.lv)} light but grows best in ${HG.LIGHT[p.light.best].label.toLowerCase()} light.`); }
    else { good.push(`Light suits it: ${LVNAME(L.lv)} (${L.note.toLowerCase()}).`); }
    if (L.how === 'window' && CK.sun) {
      const sunny = CK.sun === '2-6' || CK.sun === '6+';
      if (p.light.direct === 'avoid' && sunny) { sc.light = Math.min(sc.light, 2.5); warn.push(`${CK.sun === '6+' ? 'Six or more' : 'Two to six'} hours of direct sun can scorch it; its source says to keep it out of direct sun. Use a sheer curtain or move it back.`); }
      if (p.light.direct === 'needs' && (CK.sun === '0' || CK.sun === 'lt2')) { sc.light = Math.min(sc.light, 3); warn.push(`${p.name} wants direct sun, and this spot gets ${CK.sun === '0' ? 'none' : 'less than two hours'}.`); }
      if (p.light.direct === 'needs' && sunny) good.push('It gets the direct sun it wants.');
    }
    if (L.how === 'window') watch.push({ sev: 'note', t: 'The light level is estimated from window direction and distance. A phone light-meter reading (Learn → Light) is more reliable.' });
  }
  // ── Water ──
  if (aquatic) {
    if (!CK.change) sc.water = null;
    else if (CK.change === 'weekly') good.push('Regular water changes keep a moss ball healthy.');
    else if (CK.change === 'monthly') { sc.water = 3.5; warn.push('Change about a third of the water weekly as well as all of it monthly.'); }
    else { sc.water = 1.5; bad.push('Stale water is the most common cause of brown, mushy moss balls. Change about a third of the water weekly.'); }
  } else if (!CK.soilState) { sc.water = null; } else {
    const s = CK.soilState, st = p.water.style;
    const wetter = { dry: ['wet', 'damp', 'tray'], partial: ['wet', 'tray'], moist: ['tray'], wet: [] }[st] || [];
    const drier = { dry: [], partial: [], moist: ['dryAll'], wet: ['wet', 'damp', 'dryTop', 'dryAll'] }[st] || [];
    if (wetter.includes(s)) { const sev = st === 'dry' || s === 'tray'; sc.water = sev ? 1.5 : 2.5; (sev ? bad : warn).push(`Watered while the soil is still ${s === 'tray' ? 'sitting in water' : s === 'wet' ? 'wet' : 'damp'}. ${p.name} should be watered when it is ${HG.WATER[st].label.toLowerCase()}. ${p.water.note}`); }
    else if (drier.includes(s)) { sc.water = wet ? 1 : 2.5; (wet ? bad : warn).push(wet ? `${p.name} must never dry out: keep the pot standing in a tray of pure water.` : `It is drying out more than it likes. ${p.water.note}`); }
    else if (st === 'partial' && s === 'damp') { sc.water = 4; warn.push('Watering a little early: let the top inch or two dry first.'); }
    else good.push(`Watering matches its needs: ${HG.WATER[st].label.toLowerCase()}.`);
    if (CK.hole === 'no' && !wet) { sc.water = Math.min(sc.water, 2); bad.push('No drainage hole: extra water collects at the bottom and rots roots. Repot into a pot with a hole, or use the pot as a cover over a plastic nursery pot.'); }
    if (CK.saucer === 'standing' && !wet) { sc.water -= 1; warn.push('Water left standing in the saucer keeps the bottom roots wet. Empty it about 15 minutes after watering.'); }
    if (CK.decide === 'schedule' && (st === 'dry' || st === 'partial')) watch.push({ sev: winter ? 'weeks' : 'season', t: winter ? 'You water on a schedule, and winter growth is slow: the same schedule now keeps the soil wetter for longer. Check the soil before each watering until spring.' : 'You water on a schedule. When growth slows in winter, the same schedule will keep the soil too wet; switch to checking the soil first.' });
    if (PURE_WATER.includes(p.id) && CK.waterType === 'tap') { sc.water = Math.min(sc.water, 2); bad.push('Carnivorous plants need rain, distilled or reverse-osmosis water. Tap water is safe only if it is very low in dissolved solids (under about 90 ppm, per the International Carnivorous Plant Society).'); }
    if (FLUORIDE.includes(p.id) && CK.waterType === 'tap') { if (CK.symptoms.includes('browntips')) { sc.water -= 1; warn.push('Brown tips with tap water: this plant is sensitive to fluoride or chlorine. Try rain, distilled or filtered water.'); } else watch.push({ sev: 'note', t: 'This plant is sensitive to fluoride and chlorine in tap water. If the leaf tips brown, switch to rain, distilled or filtered water.' }); }
    if (CK.hole === 'no' && (st === 'dry' || st === 'partial') && ['wet', 'damp'].includes(s)) watch.push({ sev: 'days', t: 'Wet soil in a pot with no drainage hole is the classic setup for root rot. Watch for yellowing leaves and a soft base, and let it dry out now.' });
  }
  // ── Pot and soil ──
  if (!aquatic) {
    if (CK.mix) {
      const want = p.soil, got = CK.mix;
      if (got === want) good.push(`Potting mix matches: ${HG.SOILS[want].label.toLowerCase()}.`);
      else if (want === 'cp') { sc.soil = 1; bad.push('Carnivorous plants need a peat or sphagnum mix with no fertilizer or added minerals; regular potting mix burns their roots.'); }
      else if (want === 'bark' && got !== 'bark') { sc.soil = 2; warn.push('Moth orchids grow on tree bark in the wild and need a bark medium; soil stays too wet and rots the roots.'); }
      else if (got === 'garden') { sc.soil = 2; warn.push('Garden soil packs down in pots and drains poorly. Repot into ' + HG.SOILS[want].label.toLowerCase() + '.'); }
      else if (got === 'cp' || got === 'bark') { sc.soil = 2.5; warn.push(`That medium does not suit ${p.name}; it does best in ${HG.SOILS[want].label.toLowerCase()}.`); }
      else if (got === 'unknown') { sc.soil = 4; }
      else if (want === 'gritty' && (got === 'rich' || got === 'standard')) { sc.soil = got === 'rich' ? 2.5 : 3.5; warn.push(`It prefers a fast-draining ${HG.SOILS.gritty.label.toLowerCase()}; ${got === 'rich' ? 'a moisture-holding mix' : 'plain potting mix'} stays wet longer, so water less often.`); }
      else if ((want === 'rich' || want === 'standard') && got === 'gritty') { sc.soil = 3.5; warn.push('A gritty mix dries fast for this plant; water more often or repot into regular potting mix.'); }
      else sc.soil = 4.5;
    } else sc.soil = null;
    if (CK.pot === 'self' && (p.water.style === 'dry' || p.water.style === 'partial')) { sc.soil = Math.min(sc.soil == null ? 5 : sc.soil, 3); warn.push('Self-watering pots keep soil evenly moist, which is wetter than this plant likes.'); }
    if (CK.pot === 'clay' && p.water.style === 'dry') good.push('A clay pot helps the soil dry between waterings.');
    if (CK.roots === 'yes') { if (LIKES_POTBOUND.includes(p.id)) good.push('Roots filling the pot are fine: this plant does well slightly pot-bound.'); else { sc.soil = Math.min(sc.soil == null ? 5 : sc.soil, 3.5); warn.push('Roots are filling the pot. Move up one pot size (about 2 in wider).'); watch.push({ sev: [3, 4, 5].includes(m) ? 'weeks' : 'season', t: [3, 4, 5].includes(m) ? 'Spring is the best time to repot: do it in the next few weeks.' : 'Plan to repot in spring, when growth restarts.' }); } }
    if (CK.feed && CK.feed !== 'none') {
      if (p.soil === 'cp') { sc.soil = Math.min(sc.soil == null ? 5 : sc.soil, 1); bad.push('Never fertilize carnivorous plants: they get nutrients from insects, and fertilizer in the soil burns their roots.'); }
      else if (winter && CK.feed === 'often' && /winter|growing season|spring and summer/i.test(p.feed)) { sc.soil = Math.min(sc.soil == null ? 5 : sc.soil, 4); warn.push('Its source says to feed it ' + p.feed.replace(/\.$/, '').toLowerCase() + '; cut back in winter.'); }
      if (p.id === 'spider-plant' && CK.feed === 'often') warn.push('Too much fertilizer reduces the number of spider plant babies.');
    }
  }
  // ── Climate ──
  const air = CK.rh !== '' && !isNaN(+CK.rh) ? (+CK.rh < 40 ? 'dry' : +CK.rh < 60 ? 'avg' : 'humid') : CK.air;
  if (!air && CK.nightF === '' && !CK.drafts) sc.climate = null; else {
    const hb = p.humidity.best, ho = p.humidity.ok || hb;
    if (air === 'dry' && hb === 'high') { if (ho === 'high') { sc.climate = 2; bad.push('The air is too dry for it: it needs humid air (60% or more). Use a humidifier, group plants, or grow it in a bathroom or terrarium.'); } else { sc.climate = 3.5; warn.push('It prefers humid air; dry air may brown the leaf edges. A humidifier or pebble tray helps.'); } }
    else if (air === 'avg' && hb === 'high' && ho === 'high') { sc.climate = 3.5; warn.push('Average room air is on the dry side for it; aim for 60% humidity or more.'); }
    else if (air) good.push('Humidity suits it.');
    const nf = CK.nightF === '' ? null : +CK.nightF;
    if (nf != null && !isNaN(nf)) {
      if (p.temp.min != null && nf < p.temp.min) { sc.climate = Math.min(sc.climate, 1.5); bad.push(`Too cold at night: ${degF(nf)} is below its minimum of ${degF(p.temp.min)}.`); }
      else if (p.temp.min != null && nf < p.temp.min + 5) { sc.climate = Math.min(sc.climate, 3.5); warn.push(`Nights of ${degF(nf)} are close to its minimum of ${degF(p.temp.min)}.`); }
      else if (p.temp.ideal && nf < p.temp.ideal[0] - 5) { sc.climate = Math.min(sc.climate, 4); warn.push(`A little cool: it does best between ${degF(p.temp.ideal[0])} and ${degF(p.temp.ideal[1])}.`); }
      else good.push('Night temperature is in its comfortable range.');
    }
    if (CK.drafts === 'yes') { sc.climate = Math.min(sc.climate, 3.5); warn.push('Drafts and heating or cooling vents can cause leaf drop and brown spots; move it a few feet away.'); }
    if (winter && hb === 'high' && air !== 'humid') watch.push({ sev: 'weeks', t: 'Heating season dries indoor air. Expect crispy edges unless you raise the humidity.' });
  }
  // ── Health ──
  const sy = CK.symptoms, penalty = { yellow: 1, browntips: .75, droop: 1, drop: 1.25, leggy: 1, spots: 1, mushy: 3, pests: 1.5 };
  sy.forEach(k => sc.health -= penalty[k]);
  const hint = [];
  if (sy.includes('mushy')) bad.push('A mushy stem or base usually means rot. Unpot it, cut away soft brown roots, and repot in fresh, drier mix; take cuttings of healthy stems as a backup.');
  if (sy.includes('pests')) { warn.push('Insects or webbing: isolate the plant from your others until you identify the pest.' + (p.pests.length ? ` Common pests on ${p.name}: ${p.pests.map(x => HG.PESTS[x].toLowerCase()).join(', ')}.` : '')); }
  if (sy.includes('yellow') && ['wet', 'damp', 'tray'].includes(CK.soilState) && !wet && !aquatic) hint.push('Yellow leaves with soil that stays wet usually point to overwatering.');
  if (sy.includes('leggy') && L && L.lv < p.light.best) hint.push('Pale, stretched growth matches the low light measured here.');
  if (sy.includes('browntips') && (air === 'dry')) hint.push('Brown tips with dry air: raise the humidity.');
  if (sy.includes('drop') && p.id === 'fiddle-leaf-fig') hint.push('Fiddle-leaf figs drop leaves after moves, drafts or changes in watering.');
  if (sy.includes('droop') && CK.soilState === 'dryAll' && p.water.style !== 'dry') hint.push('Drooping with bone-dry soil means it needs water now.');
  hint.forEach(h => warn.push(h));
  if (!sy.length) good.push('No problems reported.');
  sc.health = Math.max(0, sc.health);
  // ── Season and safety ──
  if (CK.where === 'outdoors' && p.temp.min != null && [8, 9, 10].includes(m)) watch.push({ sev: 'weeks', t: `Bring it indoors before nights fall below ${degF(p.temp.min)}, and check it for pests first.` });
  if (p.id === 'christmas-cactus' && [9, 10, 11].includes(m)) { if (CK.nightLight === 'yes') { watch.push({ sev: 'weeks', t: 'Bud set needs at least 13 hours of unbroken darkness each night until mid-November. A lamp at night can stop it from flowering this year.' }); } else watch.push({ sev: 'note', t: 'Bud-setting season: keep nights dark and 55 to 65°F, and avoid moving the plant once buds form.' }); }
  if (p.id === 'moth-orchid' && [9, 10, 11].includes(m)) watch.push({ sev: 'note', t: 'Large white and spring-blooming moth orchids need about a week of 55°F nights in autumn to start a flower spike.' });
  if (p.id === 'venus-flytrap' && winter) watch.push({ sev: 'note', t: 'Winter dormancy: sources disagree. Indoor plants under strong grow lights can keep growing (ICPS); outdoor plants go dormant and need protection from freezing. See the plant page.' });
  if (winter && p.light.best === 3 && L && L.how === 'window' && L.lv <= 2) watch.push({ sev: 'season', t: 'Days are short until February. For a high-light plant, a grow light for part of the day helps it through winter.' });
  const ps = petStatus(p);
  if (CK.pets && CK.pets !== 'no') { if (ps === 'toxic') safety.push(`${p.name} is toxic to pets. Keep it out of reach. ${p.pets.signs ? 'Signs if eaten: ' + p.pets.signs.toLowerCase() + '.' : ''}`); else if (ps === 'unknown') safety.push(`No pet-toxicity information was found for ${p.name}; keep it out of reach to be safe.`); }
  // ── Overall ──
  const W = { light: .30, water: .30, soil: .15, climate: .15, health: .10 };
  const dims = Object.keys(W).filter(k => sc[k] != null);
  if (dims.length < 2) return { p, incomplete: true };
  dims.forEach(k => sc[k] = Math.max(0, Math.min(5, Math.round(sc[k] * 2) / 2)));
  const wsum = dims.reduce((a, k) => a + W[k], 0), weighted = dims.reduce((a, k) => a + sc[k] * W[k], 0) / wsum;
  let pct = Math.round(weighted / 5 * 100);
  if (dims.some(k => sc[k] <= 1)) pct = Math.min(pct, 44); else if (dims.some(k => sc[k] <= 2)) pct = Math.min(pct, 70);
  const rating = pct >= 90 ? 'Excellent' : pct >= 76 ? 'Good' : pct >= 60 ? 'Fair' : pct >= 44 ? 'Needs work' : 'Critical';
  const ord = { days: 0, weeks: 1, season: 2, note: 3 };
  return { p, sc, dims, pct, rating, good, warn, bad, watch: watch.sort((a, b) => ord[a.sev] - ord[b.sev]), safety, light: L, month: m };
}

// ── Form ──
function ckSet(k, v) { CK[k] = CK[k] === v ? '' : v; ckPaint(); }

function ckInput(k, el) { CK[k] = el.value; ckLive(); }

  CK_RES = null; ckPaint();
}
const ckChips = (k, opts) => `<div class="fchips">${opts.map(o => `<button type="button" class="fchip${CK[k] === o[0] ? ' on' : ''}" aria-pressed="${CK[k] === o[0]}" onclick="ckSet('${k}','${o[0]}')">${esc(o[1])}</button>`).join('')}</div>`;
const ckQ = (label, body, note) => `<div class="hg-q"><b>${label}</b>${body}${note ? `<p class="hg-note" style="margin:4px 0 0">${note}</p>` : ''}</div>`;
function ckLive() { const el = document.getElementById('ck-light'); if (el) { const L = ckLight(); el.innerHTML = L ? `Light here: <b>${LVNAME(L.lv)}</b>. ${esc(L.note)}.` : 'Answer the light questions to see the estimate.'; } }
function ckForm(p) {
  const aquatic = p.water.style === 'aquatic', wet = p.water.style === 'wet';
  const stateOpts = wet ? [['tray', 'Standing in a tray of water'], ['wet', 'Wet'], ['damp', 'Damp'], ['dryTop', 'Dry on top'], ['dryAll', 'Dry all the way down']]
    : [['wet', 'Still wet'], ['damp', 'Damp'], ['dryTop', 'Dry on top, damp below'], ['dryAll', 'Dry all the way down'], ['tray', 'Pot sits in water']];
  return `
  <section class="hg-sec"><h2><span class="ck-n">1</span> The spot</h2>
   ${ckQ('Nickname (optional)', `<input class="hg-search" type="text" maxlength="40" value="${esc(CK.nick)}" placeholder="e.g. Kitchen pothos" oninput="ckInput('nick',this)">`, 'Use the same nickname each time to track this plant’s history.')}
   ${ckQ('Where is it?', ckChips('where', [['indoors', 'Indoors'], ['outdoors', 'Outdoors for the season']]))}
   ${ckQ('How do you want to describe the light?', ckChips('lightHow', [['window', 'Window and distance'], ['meter', 'Light meter reading'], ['grow', 'Grow light only']]))}
   ${CK.lightHow === 'meter' ? ckQ('Reading at the leaves', `<div class="fchips"><input class="hg-search" style="max-width:160px" type="number" min="0" inputmode="decimal" value="${esc(CK.meter)}" oninput="ckInput('meter',this)" aria-label="Light reading">${['lux', 'fc'].map(u => `<button type="button" class="fchip${CK.meterUnit === u ? ' on' : ''}" onclick="CK.meterUnit='${u}';ckPaint()">${u === 'lux' ? 'lux' : 'foot-candles'}</button>`).join('')}</div>`, 'Take it at midday on a bright day, with the phone where the leaves are, facing the window.')
     : CK.lightHow === 'grow' ? ckQ('Hours a day the grow light is on', `<input class="hg-search" style="max-width:160px" type="number" min="0" max="24" value="${esc(CK.growHrs)}" oninput="ckInput('growHrs',this)" aria-label="Grow light hours">`, 'Assumes a houseplant LED within 12 to 24 in of the leaves.')
     : ckQ('Nearest window faces', ckChips('dir', DIRS)) + ckQ('Distance from the window', ckChips('dist', DIST)) + ckQ('Direct sun on the leaves', ckChips('sun', [['0', 'None'], ['lt2', 'Under 2 hours'], ['2-6', '2 to 6 hours'], ['6+', '6 hours or more']]))}
   <p class="hg-note" id="ck-light"></p>
  </section>
  <section class="hg-sec"><h2><span class="ck-n">2</span> Water${aquatic ? '' : ', pot and soil'}</h2>
   ${aquatic ? ckQ('How often do you change the water?', ckChips('change', [['weekly', 'Some every week'], ['monthly', 'About monthly'], ['rarely', 'Rarely']])) : `
   ${ckQ('When you water, the soil is usually', ckChips('soilState', stateOpts))}
   ${ckQ('How do you decide when to water?', ckChips('decide', [['feel', 'I check the soil first'], ['schedule', 'On a set schedule']]))}
   ${ckQ('Water you use', ckChips('waterType', [['tap', 'Tap'], ['filtered', 'Filtered'], ['pure', 'Rain, distilled or RO']]))}
   ${ckQ('Drainage hole in the pot?', ckChips('hole', [['yes', 'Yes'], ['no', 'No']]))}
   ${ckQ('After watering, the saucer', ckChips('saucer', [['empty', 'Is emptied or dry'], ['standing', 'Holds standing water'], ['none', 'No saucer']]))}
   ${ckQ('Pot type', ckChips('pot', [['plastic', 'Plastic'], ['clay', 'Unglazed clay'], ['glazed', 'Glazed ceramic'], ['self', 'Self-watering']]))}
   ${ckQ('Potting mix', ckChips('mix', MIX_OPTS), `Recommended: ${HG.SOILS[p.soil].label.toLowerCase()}.`)}
   ${ckQ('Roots coming out of the drainage hole or circling the pot?', ckChips('roots', [['no', 'No'], ['yes', 'Yes']]))}

  </section>
  <section class="hg-sec"><h2><span class="ck-n">3</span> Air and temperature</h2>
   ${ckQ('Humidity', ckChips('air', [['dry', 'Dry (heated or air-conditioned)'], ['avg', 'Average'], ['humid', 'Humid (bathroom, terrarium)']]) + `<div style="margin-top:6px"><input class="hg-search" style="max-width:220px" type="number" min="0" max="100" value="${esc(CK.rh)}" placeholder="Or a hygrometer reading, %" oninput="ckInput('rh',this)" aria-label="Humidity percent"></div>`)}
   ${ckQ('Coldest night temperature near the plant (°F)', `<input class="hg-search" style="max-width:160px" type="number" value="${esc(CK.nightF)}" oninput="ckInput('nightF',this)" aria-label="Coldest night temperature, °F">`)}
   ${ckQ('Near a draft, door, or heating or cooling vent?', ckChips('drafts', [['no', 'No'], ['yes', 'Yes']]))}
   ${p.id === 'christmas-cactus' ? ckQ('Is the room lit after dark?', ckChips('nightLight', [['no', 'No, it stays dark'], ['yes', 'Yes, lamps or TV']])) : ''}
  </section>
  <section class="hg-sec"><h2><span class="ck-n">4</span> How it looks</h2>
   ${ckQ('Anything you’ve noticed? (pick all that apply)', `<div class="fchips">${SYMPTOMS.map(s => `<button type="button" class="fchip${CK.symptoms.includes(s[0]) ? ' on' : ''}" aria-pressed="${CK.symptoms.includes(s[0])}" onclick="ckSym('${s[0]}')">${esc(s[1])}</button>`).join('')}</div>`)}

  </section>`;
}

// ── Results ──
const SEV = { days: ['🔴', 'Days'], weeks: ['🟠', 'Weeks'], season: ['🔵', 'This season'], note: ['⚪', 'Note'] };
const DIMS = { light: 'Light', water: 'Water', soil: 'Pot and soil', climate: 'Air and temperature', health: 'How it looks' };
const ratingColor = pct => pct >= 76 ? 'var(--ok)' : pct >= 60 ? 'var(--warn)' : 'var(--rust)';
function ckResultHtml(r) {
  const li = (a, cls) => a.length ? `<ul class="hg-list ck-${cls}">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  return `<div class="ck-overall" style="border-color:${ratingColor(r.pct)}"><div><small>Overall</small><b style="color:${ratingColor(r.pct)}">${r.rating}</b><span class="hg-note">${r.dims.length} of 5 areas answered</span></div><strong style="color:${ratingColor(r.pct)}">${r.pct}%</strong></div>
  <div class="ck-dims">${Object.keys(DIMS).map(k => r.sc[k] == null ? `<div class="ck-dim"><span>${DIMS[k]}</span><div class="ck-track"></div><em>not answered</em></div>` : `<div class="ck-dim"><span>${DIMS[k]}</span><div class="ck-track"><i style="width:${r.sc[k] / 5 * 100}%;background:${r.sc[k] >= 4 ? 'var(--ok)' : r.sc[k] >= 2.5 ? 'var(--warn)' : 'var(--rust)'}"></i></div><em>${r.sc[k]}/5</em></div>`).join('')}</div>
  ${r.safety.length ? `<div class="hg-sec hg-safety" style="margin-top:14px"><h3>⚠️ Pet safety</h3>${li(r.safety, 'bad')}</div>` : ''}
  ${r.bad.length ? `<h3 class="ck-h bad">✗ Fix first</h3>${li(r.bad, 'bad')}` : ''}
  ${r.warn.length ? `<h3 class="ck-h warn">⚠ Could be better</h3>${li(r.warn, 'warn')}` : ''}
  ${r.good.length ? `<h3 class="ck-h good">✓ Working well</h3>${li(r.good, 'good')}` : ''}
  ${CK.symptoms.length ? `<div class="hg-quick">${CK.symptoms.map(k => { const w = { yellow: 'yellow', browntips: 'browntips', droop: 'wilt', drop: 'drop', leggy: 'leggy', spots: 'spots', mushy: 'mushy', pests: 'bugs' }[k]; return `<a class="btn" href="#/whatswrong/${w}" onclick="WW.plant='${r.p.id}'">🍂 ${esc(SYMPTOMS.find(s => s[0] === k)[1])}: likely causes</a>`; }).join('')}</div>` : ''}
  ${r.watch.length ? `<h3 class="ck-h">⏱ What to watch for</h3><p class="hg-note">Likely next problems or seasonal tasks, not current faults.</p>${r.watch.map(w => `<div class="ck-watch ck-${w.sev}"><b>${SEV[w.sev][0]} ${SEV[w.sev][1]}</b><span>${esc(w.t)}</span></div>`).join('')}` : ''}`;
}
function ckRun() {
  const r = ckScore(); if (!r) return toast('Pick a plant first');
  if (r.incomplete) return toast('Answer at least two sections first');
  CK_RES = r;
  try { const last = JSON.parse(localStorage.getItem(CK_LAST) || '{}'); const keep = Object.assign({}, CK); delete keep.symptoms; last[CK.plant] = keep; localStorage.setItem(CK_LAST, JSON.stringify(last)); } catch (e) { /* ignore */ }
  ckPaint(); const el = document.getElementById('ck-result'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function ckRecord(r) {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  return { app: 'houseplant-guide', kind: 'checkup', version: HG.version, id: d.getTime().toString(36) + Math.random().toString(36).slice(2, 6),
    date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
    plant: r.p.id, plantName: r.p.name, nick: CK.nick.trim(), inputs: JSON.parse(JSON.stringify(CK)), scores: r.sc, pct: r.pct, rating: r.rating,
    bad: r.bad, warn: r.warn, good: r.good, watch: r.watch, safety: r.safety };
}
function ckSave() {
  if (!CK_RES) return; const all = ckLoad(); all.push(ckRecord(CK_RES));
  toast(ckSaveAll(all) ? 'Saved to this device' : 'Could not save: storage is blocked'); ckPaint();
}
const ckKey = c => c.plant + '|' + (c.nick || '').toLowerCase();
function ckHistory() { const k = ckKey({ plant: CK.plant, nick: CK.nick.trim() }); return ckLoad().filter(c => ckKey(c) === k).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)); }
function ckDelete(id) { ckSaveAll(ckLoad().filter(c => c.id !== id)); ckPaint(); }
function ckHistoryHtml() {
  const h = ckHistory(); if (!h.length) return '';
